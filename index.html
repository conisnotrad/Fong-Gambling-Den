<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fong Gambling Den</title>
<meta name="theme-color" content="#0f6b52">

<style>
/* Layout: one phone-first column on a jade-felt ground; fan picker drawn as a rack of tiles; tab bar along the bottom edge */
:root{
  --bg:#e7ece9; --surface:#f8faf8; --surface-2:#dde6e1; --ink:#14201b; --muted:#56675f; --line:#c7d3cc;
  --jade:#0f6b52; --jade-ink:#ffffff; --jade-soft:#d2e7de;
  --pos:#0d7650; --neg:#b3361d; --warn:#9a6200;
  --tile:#fbfaf3; --tile-edge:#0f6b52; --tile-ink:#14201b;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1411; --surface:#141f1b; --surface-2:#1c2a24; --ink:#e3ebe7; --muted:#92a49c; --line:#2a3a33;
    --jade:#3cb38b; --jade-ink:#05130e; --jade-soft:#173a2e;
    --pos:#4fd1a0; --neg:#ff7f66; --warn:#f0b44c;
    --tile:#eeebe0; --tile-edge:#2f9f7a; --tile-ink:#14201b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1411; --surface:#141f1b; --surface-2:#1c2a24; --ink:#e3ebe7; --muted:#92a49c; --line:#2a3a33;
  --jade:#3cb38b; --jade-ink:#05130e; --jade-soft:#173a2e;
  --pos:#4fd1a0; --neg:#ff7f66; --warn:#f0b44c;
  --tile:#eeebe0; --tile-edge:#2f9f7a; --tile-ink:#14201b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.mark{width:30px;height:38px;border-radius:6px;background:var(--tile);color:var(--jade);border:1px solid var(--line);border-bottom:5px solid var(--tile-edge);display:grid;place-items:center;font:20px/1 var(--display);flex:none}
.brand{font:20px/1.1 var(--display);margin:0;flex:1;min-width:0}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.admin{background:var(--jade);color:var(--jade-ink)}
.pill.demo{background:var(--warn);color:var(--surface)}

.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
h2{font:19px/1.2 var(--display);margin:0;text-wrap:balance}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.empty{align-items:flex-start}
.note{background:var(--jade-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.note.warn{background:var(--surface-2);border-left:4px solid var(--warn)}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:-6px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600}
.chip.on{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.chip .cnt{font-weight:500;opacity:.75;font-variant-numeric:tabular-nums;margin-left:4px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 2px;font-weight:600;font-size:13.5px;color:var(--muted);min-width:0;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.span2{grid-column:1/-1}
.pbtn{min-height:54px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:600;font-size:16px;text-align:left;display:flex;flex-direction:column;justify-content:center;min-width:0;overflow-wrap:anywhere}
.pbtn small{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pbtn.on{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.pbtn.on small{color:inherit;opacity:.8}
.pbtn.self{border-style:dashed}
.pbtn.self.on{border-style:solid}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.tile{background:var(--tile);color:var(--tile-ink);border:1px solid var(--line);border-bottom:6px solid var(--tile-edge);border-radius:9px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s}
.tile b{font:22px/1 var(--display)}
.tile span{font-size:11px;font-variant-numeric:tabular-nums;color:#5a6b63}
.tile.on{transform:translateY(-5px);background:var(--jade);color:#fff;border-bottom-color:#08402f}
.tile.on span{color:#d8efe6}

.preview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.preview div{display:flex;justify-content:space-between;gap:8px;min-width:0}
.preview span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
b.pos,.pos{color:var(--pos)} b.neg,.neg{color:var(--neg)} .zero{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.btn{border:0;background:var(--jade);color:var(--jade-ink);border-radius:11px;padding:10px 16px;font-weight:700}
.btn.big{padding:15px 18px;font-size:17px;width:100%}
.btn.ghost{background:transparent;color:var(--jade);border:1px solid var(--line)}
.btn.danger{background:var(--neg);color:var(--surface)}
.btn.link{background:none;color:var(--jade);padding:4px 2px;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;flex-direction:column;gap:8px}

input[type=text],input[type=number],input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;max-width:100%}
input[type=number]{width:80px}
.inline{display:flex;gap:8px}
.inline > input,.inline > select{flex:1}

.seats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.seats li{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:8px 8px 8px 12px;font-weight:600}
.seats li .grow{overflow-wrap:anywhere}
.x{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:15px}
.x:hover{background:var(--surface);color:var(--neg)}
.badge{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--jade-soft);color:var(--jade)}
.badge.warn{background:var(--surface-2);color:var(--warn)}

.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.board li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:11px 2px;border-top:1px solid var(--line)}
.board li:first-child{border-top:0}
.board .rk{font:18px/1 var(--display);color:var(--muted);text-align:center}
.board li:nth-child(1) .rk{color:var(--jade)}
.board .nm{font-weight:700;overflow-wrap:anywhere}
.board .pts{font:20px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.board li.tap{cursor:pointer}
.board li.tap:hover{background:var(--surface-2)}
.board .pts small{display:block;font:600 10.5px/1.2 var(--body);color:var(--muted);letter-spacing:.03em;text-transform:uppercase;margin-top:3px}
.sgrid{grid-column:2/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:4px}
.sgrid div{background:var(--surface-2);border-radius:8px;padding:5px 4px;text-align:center;min-width:0;border:1px solid transparent}
.sgrid div.on{border-color:var(--jade)}
.sgrid b{display:block;font:16px/1.1 var(--display);font-variant-numeric:tabular-nums}
.sgrid span{font-size:10.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.sortbar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.sortbar select{flex:1;padding:6px 9px}
.sortbar .btn{padding:6px 10px;font-size:13px}
.board .meta{grid-column:2/-1;font-size:13px;color:var(--muted)}
.board li.cut{border-top:2px dashed var(--jade)}
.tiebtns{display:inline-flex;gap:2px;margin-left:6px;vertical-align:middle}
.tiebtns button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:26px;height:24px;font-size:11px;padding:0}

.hands{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hands li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.hands li:first-child{border-top:0}
.hands .t{font-size:12px;color:var(--muted);width:58px;flex:none;padding-top:2px;font-variant-numeric:tabular-nums}
.hands .d{flex:1;min-width:0;overflow-wrap:anywhere}
.hands .d .sub{font-size:13px;color:var(--muted)}
.hands .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.night{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.night > button{width:100%;display:flex;gap:10px;align-items:center;justify-content:space-between;border:0;background:transparent;padding:14px 16px;text-align:left}
.night > button h2{font-size:17px}
.night .body{padding:0 16px 12px}

.fantable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.fantable th,.fantable td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.fantable th:first-child,.fantable td:first-child{text-align:left}
.fantable th{font-size:12px;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}

.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.checks label{display:flex;gap:8px;align-items:center;background:var(--surface-2);padding:8px 10px;border-radius:9px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.tabs button{border:0;background:transparent;border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;min-width:0;font-weight:600;color:var(--muted)}
.tabs button .ic{font:17px/1 var(--display);width:30px;height:26px;display:grid;place-items:center;border-radius:7px}
.tabs button.on{color:var(--jade)}
.tabs button.on .ic{background:var(--jade);color:var(--jade-ink)}

.jump{display:flex;flex-wrap:wrap;gap:8px}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rules li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.rules li:first-child{border-top:0}
.rules .rd{flex:1;min-width:0}
.rules .rd b{display:block}
.rules .rd span{font-size:14px;color:var(--muted)}
.ftile{flex:none;width:40px;min-height:46px;background:var(--tile);color:var(--tile-ink);border:1px solid var(--line);border-bottom:5px solid var(--tile-edge);border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 0}
.ftile b{font:18px/1 var(--display)}
.ftile small{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#5a6b63}
.ftile.limit{background:var(--jade);color:#fff;border-bottom-color:#08402f}
.ftile.limit small{color:#d8efe6}
[id^="r-"]{scroll-margin-top:76px}
.house{border-left:4px solid var(--jade)}
.eg{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:7px}
.eg .grp{display:inline-flex;gap:2px}
.eg .grp.win{padding-left:8px;border-left:2px dashed var(--line);align-items:flex-end}
.mt{display:inline-block;flex:none;width:24px;height:32px;line-height:0}
.mt svg{width:100%;height:100%;display:block}
.mt.lucky{border-radius:4px;box-shadow:0 0 0 2px var(--jade)}
.trow .mt{width:28px;height:37px}
.cp .steps{margin:12px 0 0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.cp .steps>li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px}
.cp .steps>li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--jade);color:#fff;display:flex;align-items:center;justify-content:center;font:15px/1 var(--display)}
.cp .steps>li>div>b{display:block}.cp .steps p{margin:2px 0 0}
.pay{width:100%;border-collapse:collapse;font-size:13.5px}
.pay th,.pay td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.pay th{font-size:12px;color:var(--muted);font-weight:600}.pay td:first-child{font-weight:600}
.cash{font-variant-numeric:tabular-nums;color:var(--jade);font-weight:700}
.worked{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:8px}
.worked .eg{margin:6px 0}.worked p{margin:4px 0;font-size:13.5px}
.tag{display:inline-block;font:700 11px/1.4 var(--body);letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.tguide{display:flex;flex-direction:column;gap:12px}
.trow{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;justify-items:center}
.trow.short{grid-template-columns:repeat(7,minmax(0,1fr))}
.trow figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.trow figcaption{font-size:11px;line-height:1.15;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.trow figcaption b{display:block;color:var(--ink);font-size:12px}
.house ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.house ul ul{margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.err{background:var(--neg);color:#fff}
#toast button{border:0;background:transparent;color:inherit;text-decoration:underline;font-weight:700}
.modal-bg{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:grid;place-items:end center;padding:16px}
.modal{background:var(--surface);border-radius:16px;padding:18px;width:100%;max-width:520px;max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (min-width:520px){.pgrid{grid-template-columns:repeat(4,1fr)} .pgrid .pbtn.self{grid-column:span 1}}
</style>
</head>

<script type="module">
// ============================================================
//  CONFIG — paste your Firebase details here (see SETUP.md)
// ============================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBKJLVXt_FOjV_HtpU34gFEW6zBHhbIO7k",
  authDomain: "fong-gambling-den.firebaseapp.com",
  projectId: "fong-gambling-den",

  messagingSenderId: "442207096169",
  appId: "1:442207096169:web:22fbb47908957be9fc81f8"
};
// Your Google account email. Must match the one in firestore.rules.
const ADMIN_EMAIL = "conisnotrad@gmail.com";
// ============================================================

const DEMO = !FIREBASE_CONFIG.apiKey;
const TZ = "Australia/Sydney";
const MIN_FAN = 3, MAX_FAN = 13;
const WINDS = ["East", "South", "West", "North"];
const LETTERS = "ABCDEFGHIJKLMNOP";

// Points for 3..13 fan. Points are always recalculated from the current ruleset, so changing it rewrites every total.
const RULESETS = {
  uts10:   { name: "UTS 10x Scaled", pts: [2, 4, 6, 8, 12, 16, 24, 32, 48, 64, 96] },
  uts:     { name: "UTS",            pts: [0.2, 0.4, 0.6, 0.8, 1.2, 1.6, 2.4, 3.2, 4.8, 6.4, 9.6] },
  hkSpicy: { name: "HK Spicy",       pts: [8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192] },
  hkHalf:  { name: "HK Half",        pts: [8, 16, 24, 32, 48, 64, 96, 128, 192, 256, 384] },
};
const SELF_DRAW = {
  half: { name: "Each pays half (winner gets 1.5×)", mult: 0.5 },
  full: { name: "Each pays full (winner gets 3×)", mult: 1 },
};

// ---------- helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const newId = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-5);
const r2 = x => Math.round(x * 100) / 100;
const num = x => r2(x).toLocaleString("en-AU", { maximumFractionDigits: 2 });
const fmt = x => { const v = r2(x); return (v > 0 ? "+" : v < 0 ? "−" : "") + num(Math.abs(v)); };
const cls = x => r2(x) > 0 ? "pos" : r2(x) < 0 ? "neg" : "zero";
const sydDate = ts => new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(ts));
const niceDate = d => { const [y, m, dd] = d.split("-").map(Number); return new Date(Date.UTC(y, m - 1, dd)).toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }); };
const timeOf = ts => new Date(ts).toLocaleTimeString("en-AU", { timeZone: TZ, hour: "numeric", minute: "2-digit" });
const dayMs = d => { const [y, m, dd] = d.split("-").map(Number); return Date.UTC(y, m - 1, dd); };
const fanRange = () => Array.from({ length: MAX_FAN - MIN_FAN + 1 }, (_, i) => MIN_FAN + i);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

// ---------- scoring ----------
function basePoints(fan, ruleset) {
  const t = (RULESETS[ruleset] || RULESETS.uts10).pts;
  const f = Math.min(MAX_FAN, Math.max(MIN_FAN, Math.round(fan)));
  return t[f - MIN_FAN];
}
// Point changes for one hand: {playerId: delta}
function handDeltas(h, settings) {
  const d = {};
  if (h.draw || !h.winner) return d;
  const b = basePoints(h.fan, settings.ruleset);
  if (h.selfDraw) {
    const m = (SELF_DRAW[settings.selfDraw] || SELF_DRAW.half).mult;
    const others = (h.seats || []).filter(p => p !== h.winner);

// ---------- stores ----------
async function makeFirebaseStore() {
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [{ initializeApp }, A, F] = await Promise.all([
    import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
  const app = initializeApp(FIREBASE_CONFIG);
  const auth = A.getAuth(app);
  let db;
  try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch { db = F.getFirestore(app); }
  const col = n => F.collection(db, n);
  return {
    start(onChange) {
      const fail = e => { console.error(e); S.loadError = (e.code || "") + " " + (e.message || ""); toast("Couldn't load data: " + (e.code || e.message), true); onChange(); };
      // If nothing arrives in 12 s, show the problem instead of spinning forever
      setTimeout(() => { if (!S.ready && !S.loadError) { S.loadError = "No reply from the database after 12 seconds."; onChange(); } }, 12000);
      A.onAuthStateChanged(auth, u => {
        S.user = u;
        S.isAdmin = !!(u && u.email && ADMIN_EMAIL && u.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
        if (!u) A.signInAnonymously(auth).catch(e => toast("Sign-in failed: " + (e.code || e.message) + ". Check SETUP.md step 3.", true));
        onChange();
      });
      F.onSnapshot(col("players"), s => { S.players = {}; s.forEach(d => S.players[d.id] = { id: d.id, ...d.data() }); onChange(); }, fail);
      F.onSnapshot(F.query(col("tables"), F.where("open", "==", true)), s => { S.tables = {}; s.forEach(d => S.tables[d.id] = { id: d.id, ...d.data() }); onChange(); }, fail);
      F.onSnapshot(col("nights"), s => { S.nights = {}; s.forEach(d => S.nights[d.id] = d.data()); S.ready = true; onChange(); }, fail);
      F.onSnapshot(F.doc(db, "settings", "main"), d => { S.settings = { ruleset: "uts10", selfDraw: "half", ...(d.exists() ? d.data() : {}) }; onChange(); }, fail);
      F.onSnapshot(col("tournaments"), s => { S.tournaments = {}; s.forEach(d => S.tournaments[d.id] = { id: d.id, ...d.data() }); onChange(); }, fail);
    },
    signInAdmin: () => A.signInWithPopup(auth, new A.GoogleAuthProvider()),
    signOut: () => A.signOut(auth),
    addPlayer: name => F.addDoc(col("players"), { name, active: true, createdAt: Date.now() }),
    updatePlayer: (id, p) => F.updateDoc(F.doc(db, "players", id), p),
    createTable: async data => (await F.addDoc(col("tables"), data)).id,
    updateTable: (id, p) => F.updateDoc(F.doc(db, "tables", id), p),
    addHand: h => F.setDoc(F.doc(db, "nights", h.night), { date: h.date, hands: F.arrayUnion(h) }, { merge: true }),
    saveNight: (id, p) => F.setDoc(F.doc(db, "nights", id), p, { merge: true }),
    replaceHand: (date, id, nh) => F.runTransaction(db, async tx => {
      const ref = F.doc(db, "nights", date);
      const snap = await tx.get(ref);
      const hands = snap.data()?.hands || [];
      if (nh && nh.night !== date) { // moving the hand to another night
        const ref2 = F.doc(db, "nights", nh.night);
        const snap2 = await tx.get(ref2);
        tx.update(ref, { hands: hands.filter(h => h.id !== id) });
        if (snap2.exists()) tx.update(ref2, { hands: [...(snap2.data().hands || []), nh].sort((a, b) => a.ts - b.ts) });
        else tx.set(ref2, { date: nh.date, hands: [nh] });
        return;
      }
      tx.update(ref, { hands: nh ? hands.map(h => h.id === id ? nh : h) : hands.filter(h => h.id !== id) });
    }),
    setSettings: p => F.setDoc(F.doc(db, "settings", "main"), p, { merge: true }),
    saveTournament: async (id, data) => {
      if (id) { await F.updateDoc(F.doc(db, "tournaments", id), data); return id; }
      return (await F.addDoc(col("tournaments"), data)).id;
    },
  };
}

// Demo mode: same features, data kept only in this browser. Used until FIREBASE_CONFIG is filled in.
function makeDemoStore() {
  const KEY = "fgd-demo-v1";

  try { D = JSON.parse(lsGet(KEY)); } catch {}
  if (!D) D = seedDemo();
  let cb = () => {};
  const push = () => {
    S.players = structuredClone(D.players);
    S.tables = Object.fromEntries(Object.entries(structuredClone(D.tables)).filter(([, t]) => t.open));
    S.nights = structuredClone(D.nights);
    S.settings = { ruleset: "uts10", selfDraw: "half", ...D.settings };

    S.isAdmin = !!D.admin; S.user = { demo: true }; S.ready = true;
    cb();
  };
  const save = () => { lsSet(KEY, JSON.stringify(D)); push(); };
  const ok = v => Promise.resolve(v);
  return {
    start(c) { cb = c; push(); },
    reset() { D = seedDemo(); save(); },
    signInAdmin() { D.admin = true; save(); return ok(); },
    signOut() { D.admin = false; save(); return ok(); },
    addPlayer(name) { const id = newId(); D.players[id] = { id, name, active: true, createdAt: Date.now() }; save(); return ok(); },
    updatePlayer(id, p) { Object.assign(D.players[id], p); save(); return ok(); },
    createTable(data) { const id = newId(); D.tables[id] = { id, ...data }; save(); return ok(id); },
    updateTable(id, p) { Object.assign(D.tables[id], p); save(); return ok(); },
    addHand(h) { (D.nights[h.night] ||= { date: h.date, hands: [] }).hands.push(h); save(); return ok(); },
    saveNight(id, p) { D.nights[id] = { hands: [], ...(D.nights[id] || {}), ...p }; save(); return ok(); },
    replaceHand(date, id, nh) {
      const n = D.nights[date];
      if (nh && nh.night !== date) { n.hands = n.hands.filter(h => h.id !== id); const m = (D.nights[nh.night] ||= { date: nh.date, hands: [] }); m.hands = [...m.hands, nh].sort((a, b) => a.ts - b.ts); }
      else n.hands = nh ? n.hands.map(h => h.id === id ? nh : h) : n.hands.filter(h => h.id !== id);
      save(); return ok();
    },
    setSettings(p) { Object.assign(D.settings, p); save(); return ok(); },
    saveTournament(id, data) { if (id) Object.assign(D.tournaments[id], data); else { id = newId(); D.tournaments[id] = { id, ...data }; } save(); return ok(id); },
  };
}

  h += `<div class="label">Off whom?</div><div class="pgrid">`;

    h += `<button class="pbtn self ${ui.from === "self" ? "on" : ""}" data-act="pickFrom" data-id="self"><small>Everyone pays</small>Self-draw</button>`;
    h += t.seats.filter(p => p !== ui.winner).map(p => `<button class="pbtn ${ui.from === p ? "on" : ""}" data-act="pickFrom" data-id="${p}"><small>Discarded by</small>${esc(pname(p))}</button>`).join("");
  } else h += `<p class="muted span2">Pick the winner first.</p>`;
  h += `</div>`;
  h += `<div class="label">Fan · ${esc(RULESETS[S.settings.ruleset]?.name)}</div><div class="tiles">${fanRange().map(f =>
    `<button class="tile ${ui.fan === f ? "on" : ""}" data-act="pickFan" data-fan="${f}" aria-label="${f} fan, ${num(basePoints(f, S.settings.ruleset))} points"><b>${f}</b><span>${num(basePoints(f, S.settings.ruleset))}</span></button>`).join("")}</div>`;
  const ready = ui.winner && ui.from && ui.fan;
  if (ready) {
    const d = handDeltas({ seats: t.seats, winner: ui.winner, discarder: ui.from === "self" ? null : ui.from, selfDraw: ui.from === "self", fan: ui.fan }, S.settings);
    h += `<div class="preview">${t.seats.map(p => `<div><span>${esc(pname(p))}</span><b class="num ${cls(d[p] || 0)}">${fmt(d[p] || 0)}</b></div>`).join("")}</div>`;
  }
  h += `<div class="actions"><button class="btn big" data-act="recordHand" ${ready ? "" : "disabled"}>Record hand</button>
    ${confirmBtn("draw:" + t.id, "Record a draw (no winner)", "Tap again to record a draw", "recordDraw")}</div>`;
  const recent = allHands().filter(x => x.tableId === t.id && x.night === curNight().id).slice(-5).reverse();
  if (recent.length) h += `<section class="card"><h3>Latest at ${esc(t.name)}</h3><ul class="hands">${recent.map(x => {
    const d = handDeltas(x, S.settings); return `<li><span class="t">${timeOf(x.ts)}</span><span class="d">${handLine(x)}</span><span class="v ${cls(d[x.winner] || 0)}">${x.draw ? "" : fmt(d[x.winner] || 0)}</span></li>`; }).join("")}</ul></section>`;
  return h + `</div>`;
};

VIEWS.tables = () => {
  const open = openTables();
  const seatedAt = {}; open.forEach(t => t.seats.forEach(p => seatedAt[p] = t));
  let h = `<div class="stack">` + nightCard();
  if (S.isAdmin) h += `<section class="card"><h2>Open a table</h2><div class="inline"><input type="text" id="newTable" data-model="newTable" placeholder="Table ${open.length + 1}" value="${esc(ui.d.newTable || "")}" maxlength="40" aria-label="Table name"><button class="btn" data-act="openTable">Open</button></div></section>`;
  if (!open.length) h += S.isAdmin ? `<p class="muted">No tables are open right now.</p>` : `<section class="card empty"><h2>No tables are open</h2><p class="muted">The admin opens tables. Once one is open, you can seat yourself and others here.</p></section>`;
  for (const t of open) {
    const locked = t.tournamentId && !S.isAdmin;
    const avail = activePlayers().filter(p => !t.seats.includes(p.id) && (S.isAdmin || !seatedAt[p.id]?.tournamentId));
    h += `<section class="card"><div class="row between"><h2 class="grow">${esc(t.name)}</h2>${t.tournamentId ? `<span class="badge">Tournament</span>` : ""}<span class="muted small num">${t.seats.length}/4</span></div>`;
    h += t.seats.length ? `<ul class="seats">${t.seats.map(p => `<li><span class="grow">${esc(pname(p))}</span>${locked ? "" : `<button class="x" data-act="unseat" data-t="${t.id}" data-id="${p}" aria-label="Remove ${esc(pname(p))}">✕</button>`}</li>`).join("")}</ul>` : `<p class="muted">Nobody seated yet.</p>`;
    if (!locked && t.seats.length < 4) h += `<select id="seat-${t.id}" data-change="seat" data-t="${t.id}" aria-label="Add a player to ${esc(t.name)}"><option value="">Add a player…</option>${avail.map(p =>
      `<option value="${p.id}">${esc(p.name)}${seatedAt[p.id] ? ` (moves from ${esc(seatedAt[p.id].name)})` : ""}</option>`).join("")}</select>`;
    if (locked) h += `<p class="muted small">Tournament seating is set by the admin.</p>`;
    else if (S.isAdmin) h += `<div>${confirmBtn("close:" + t.id, "Close table", "Tap again to close " + esc(t.name), "closeTable", `data-t="${t.id}"`)}</div>`;
    h += `</section>`;
  }
  if (!activePlayers().length) h += `<p class="note warn">There are no players yet. The admin adds players on the Admin tab.</p>`;
  return h + `</div>`;
};

// Stats players can sort the Scores boards by: [key, menu label, value shown, short label]
const STAT_SORTS = [
  ["pts", "Points", s => s.pts, ""],
  ["wins", "Wins", s => s.wins, "wins"],
  ["selfDraws", "Self-draws", s => s.selfDraws, "self-draws"],
  ["dealIns", "Discards", s => s.dealIns, "discards"],
  ["played", "Hands played", s => s.played, "hands"],
  ["bestFan", "Best fan", s => s.bestFan, "best fan"],
  ["fanTotal", "Total fan", s => s.fanTotal, "total fan"],
  ["won", "Points won", s => s.won, "won"],
  ["paid", "Points paid", s => s.paid, "paid"],
];
const sortDef = () => STAT_SORTS.find(x => x[0] === ui.sort) || STAT_SORTS[0];
// Re-order an already-ranked list by the chosen stat; ties keep the normal ranking order
function sortStats(list) {
  if (ui.sort === "pts" && ui.sortDir === -1) return list;
  const get = sortDef()[2];
  return list.map((s, i) => [s, i]).sort((a, b) => ui.sortDir * (r2(get(a[0])) - r2(get(b[0]))) || a[1] - b[1]).map(x => x[0]);
}
const sortBar = () => `<div class="sortbar"><label for="sortPick">Sort by</label><select id="sortPick" data-change="sortBy">${STAT_SORTS.map(([k, l]) =>
  `<option value="${k}" ${k === ui.sort ? "selected" : ""}>${l}</option>`).join("")}</select><button class="btn ghost" data-act="sortDir" aria-label="${ui.sortDir < 0 ? "Highest first, tap for lowest first" : "Lowest first, tap for highest first"}">${ui.sortDir < 0 ? "High ↓" : "Low ↑"}</button></div>`;
function statGrid(s) {
  const cell = (k, v, l, c = "") => `<div class="${ui.sort === k ? "on" : ""}"><b class="${c}">${v}</b><span>${l}</span></div>`;
  return `<div class="sgrid">${cell("wins", s.wins, "Wins")}${cell("selfDraws", s.selfDraws, "Self-draw")}${cell("dealIns", s.dealIns, "Discards")}${cell("played", s.played, "Hands")}
    ${cell("bestFan", s.bestFan || "–", "Best fan")}${cell("fanTotal", s.fanTotal, "Total fan")}${cell("won", "+" + num(s.won), "Won", "pos")}${cell("paid", "−" + num(s.paid), "Paid", "neg")}</div>`;
}
// Scores boards show ranked players only, unless the viewer turns provisional players on
function provFilter(list) { return ui.showProv ? list : list.filter(s => isRanked(s.id)); }
const provToggle = (list) => {
  const n = list.filter(s => !isRanked(s.id)).length;
  return n ? `<button class="chip ${ui.showProv ? "on" : ""}" data-act="toggleProv" aria-pressed="${ui.showProv}">${ui.showProv ? "Hide" : "Show"} provisional<span class="cnt">${n}</span></button>` : "";
};
const provEmpty = () => `<p class="muted">No ranked players here yet. Tap <b>Show provisional</b> to see everyone.</p>`;
// "prov 7/25": all-time hands towards being ranked. Admin-unranked players already have 25+, so show what they need instead.
const provText = x => x.manual ? (x.rd <= ELO.rdRanked ? "back after next hand" : `needs RD ${ELO.rdRanked}`) : `${Math.min(x.n, ELO.minHands)}/${ELO.minHands}`;
const provBadge = id => { const x = eloOf(id); return !x || x.ranked ? "" : ` <span class="badge warn" title="Provisional: not ranked yet">prov ${provText(x)}</span>`; };
function boardRows(list, opts = {}) {
  return `<ul class="board">${list.map((s, i) => {
    const tieUp = opts.tie && i > 0 && sameMetrics(list[i - 1], s);
    const tieDown = opts.tie && i < list.length - 1 && sameMetrics(list[i + 1], s);
    const meta = [`${s.wins} win${s.wins === 1 ? "" : "s"}`, `${s.selfDraws} self-draw${s.selfDraws === 1 ? "" : "s"}`, `${s.dealIns} discard${s.dealIns === 1 ? "" : "s"}`,
      s.bestFan ? `best ${s.bestFan} fan` : "", opts.tie ? `${s.fanTotal} fan total` : "", `${s.played} hand${s.played === 1 ? "" : "s"}`, opts.nights ? `${s.nights.size} night${s.nights.size === 1 ? "" : "s"}` : ""].filter(Boolean).join(" · ");
    const tieCtl = (tieUp || tieDown) ? ` <span class="badge warn">tied</span>` + (S.isAdmin && opts.T ? `<span class="tiebtns">${tieUp ? `<button data-act="tieSwap" data-t="${opts.T.id}" data-stage="${opts.stage}" data-i="${i}" data-dir="-1" aria-label="Move up">▲</button>` : ""}${tieDown ? `<button data-act="tieSwap" data-t="${opts.T.id}" data-stage="${opts.stage}" data-i="${i}" data-dir="1" aria-label="Move down">▼</button>` : ""}</span>` : "") : "";
    if (!opts.full) return `<li class="${opts.cut && i === opts.cut ? "cut" : ""}"><span class="rk">${i + 1}</span><span class="nm">${esc(pname(s.id))}${tieCtl}</span><span class="pts ${cls(s.pts)}">${fmt(s.pts)}</span><span class="meta">${meta}</span></li>`;
    // Scores boards: tap a player to open their stats; the big number shows whatever the board is sorted by
    const key = opts.full + ":" + s.id, open = !!ui.pOpen[key], [sk, , get, lab] = sortDef();
    const big = sk === "pts" ? `<span class="pts ${cls(s.pts)}">${fmt(s.pts)}</span>`
      : `<span class="pts ${sk === "won" ? "pos" : sk === "paid" ? "neg" : ""}">${sk === "won" ? "+" : sk === "paid" ? "−" : ""}${num(get(s))}<small>${lab}</small></span>`;
    return `<li class="tap" data-act="pOpen" data-key="${esc(key)}" role="button" tabindex="0" aria-expanded="${open}"><span class="rk">${i + 1}</span><span class="nm">${esc(pname(s.id))}${opts.noProv ? "" : provBadge(s.id)}</span>${big}${open ? statGrid(s)
      : `<span class="meta">${meta} · <span class="pos">+${num(s.won)}</span> / <span class="neg">−${num(s.paid)}</span>${sk !== "pts" ? ` · net <span class="${cls(s.pts)}">${fmt(s.pts)}</span>` : ""}</span>`}</li>`;
  }).join("")}</ul>`;
}
const rulesNote = () => `<p class="muted small">Scored with ${esc(RULESETS[S.settings.ruleset]?.name)}; self-draw: ${esc((SELF_DRAW[S.settings.selfDraw] || SELF_DRAW.half).name.toLowerCase())}.</p>`;

function eloView() {
  const { st, lastNight } = eloState();
  const all = Object.values(st).filter(x => S.players[x.id]);
  if (!all.length) return `<section class="card empty"><h2>Ratings</h2><p class="muted">Ratings appear once hands are recorded.</p></section>`;
  const ranked = all.filter(x => x.ranked && !x.inactive).sort((a, b) => b.r - a.r);
  const prov = all.filter(x => !x.ranked).sort((a, b) => b.r - a.r);
  const inactive = all.filter(x => x.inactive).length;
  const when = curNight()?.id === lastNight ? "tonight" : "last night";
  const dl = x => x.delta && Math.abs(x.delta) >= 0.5 ? ` · <span class="${x.delta > 0 ? "pos" : "neg"}">${x.delta > 0 ? "+" : "−"}${Math.round(Math.abs(x.delta))} ${when}</span>` : "";
  const grid = x => `<div class="sgrid"><div><b>${Math.round(x.r)}</b><span>Rating</span></div><div><b>${Math.round(x.rd)}</b><span>RD</span></div><div><b>±${Math.round(2 * x.rd)}</b><span>Margin</span></div><div><b>${x.n}</b><span>Hands</span></div>
    <div><b>${Math.round(x.peak)}</b><span>Peak</span></div><div><b>${num(x.w)}</b><span>Wins</span></div><div><b>${x.l}</b><span>Losses</span></div><div><b>${x.missed}</b><span>Nights out</span></div></div>`;
  const row = (x, i) => {
    const meta = `${x.n} hand${x.n === 1 ? "" : "s"}${ui.eloAdv ? "" : ` · ±${Math.round(2 * x.rd)}`}${x.manual && x.rd > ELO.rdRanked ? ` · RD now ${Math.round(x.rd)}` : ""}${dl(x)}`;
    return `<li><span class="rk">${x.ranked ? i + 1 : "–"}</span><span class="nm">${esc(pname(x.id))}${x.ranked ? "" : ` <span class="badge warn">prov ${provText(x)}</span>`}${x.manual ? ` <span class="badge warn">set by admin</span>` : ""}</span><span class="pts num">${Math.round(x.r)}</span>${ui.eloAdv ? grid(x) : ""}<span class="meta">${meta}</span></li>`;
  };
  let h = `<section class="card"><div class="row between"><h2>Ratings</h2><span class="muted small num">${ranked.length} ranked</span></div>
    <div class="chips">${prov.length ? `<button class="chip ${ui.showProv ? "on" : ""}" data-act="toggleProv" aria-pressed="${ui.showProv}">${ui.showProv ? "Hide" : "Show"} provisional<span class="cnt">${prov.length}</span></button>` : ""}<button class="chip ${ui.eloAdv ? "on" : ""}" data-act="toggleEloAdv" aria-pressed="${ui.eloAdv}">Advanced stats</button></div>`;
  h += ranked.length ? `<ul class="board">${ranked.map(row).join("")}</ul>` : `<p class="muted">No ranked players yet.${prov.length && !ui.showProv ? " Tap <b>Show provisional</b> to see everyone." : ""}</p>`;
  if (ui.showProv && prov.length) h += `<h3>Provisional</h3><ul class="board">${prov.map(row).join("")}</ul>`;
  if (inactive) h += `<p class="muted small">${inactive} ranked player${inactive === 1 ? " is" : "s are"} hidden after missing ${ELO.inactiveNights}+ nights in a row. They come back as soon as they play.</p>`;
  if (ui.eloAdv) h += `<p class="muted small"><b>RD</b> (rating deviation) is how uncertain a rating is: lower means more settled. It shrinks as you play and grows a little each night you miss. Margin is ±2 × RD.</p>`;
  h += `<p class="muted small">Glicko ratings, updated after every hand. Everyone starts at ${ELO.start}. Bigger hands move ratings more. A player becomes ranked after ${ELO.minHands} hands or once their RD drops to ${ELO.rdRanked}.</p></section>`;
  return h;
}

VIEWS.scores = () => {
  const hands = allHands();
  const dates = Object.keys(S.nights).filter(k => S.nights[k].hands?.length).sort().reverse();
  let h = `<div class="stack"><div class="seg" role="tablist">${[["today", "Tonight"], ["night", "Night"], ["all", "All-time"], ["tourney", "Tourneys"], ["elo", "Elo"]].map(([k, l]) =>
    `<button class="${ui.scope === k ? "on" : ""}" data-act="scope" data-scope="${k}">${l}</button>`).join("")}</div>`;
  if (ui.scope === "tourney") return h + tourneyHistory() + `</div>`;
  if (ui.scope === "elo") return h + eloView() + `</div>`;
  let sel, title;
  if (ui.scope === "night") {
    if (!dates.length) return h + `<section class="card empty"><h2>No game nights yet</h2><p class="muted">Nights appear here once the first hand is recorded.</p></section></div>`;
    if (!ui.date || !dates.includes(ui.date)) ui.date = dates[0];
    h += `<select id="nightPick" data-change="night" aria-label="Game night">${dates.map(d => `<option value="${d}" ${d === ui.date ? "selected" : ""}>${nightLabel(d)} · ${S.nights[d]?.hands?.length || 0} hands</option>`).join("")}</select>`;
    sel = hands.filter(x => x.night === ui.date); title = nightLabel(ui.date);
  } else if (ui.scope === "all") { sel = hands; title = "All-time"; }
  else {
    const N = curNight(), k = N ? N.id : dates[0];
    sel = k ? hands.filter(x => x.night === k) : [];
    title = N ? "Tonight · " + nightLabel(k) : k ? "Last night · " + nightLabel(k) : "Tonight";
  }
  const list = rankList(statsFor(sel, S.settings)).filter(s => s.played > 0);
  h += `<section class="card"><div class="row between"><h2>${title}</h2><span class="muted small num">${sel.length} hand${sel.length === 1 ? "" : "s"}</span></div>`;
  const shown = provFilter(list);
  if (list.length) h += sortBar() + (provToggle(list) ? `<div class="chips">${provToggle(list)}</div>` : "");
  h += shown.length ? boardRows(sortStats(shown), { nights: ui.scope === "all", full: ui.scope }) + `<p class="muted small">Tap a player for their full stats.</p>` : list.length ? provEmpty() : `<p class="muted">No hands recorded ${ui.scope === "today" ? (curNight() ? "tonight yet" : "yet. The admin begins each game night") : "here"}.</p>`;
  h += rulesNote() + `</section></div>`;
  return h;
};

function tourneyHistory() {
  const all = Object.values(S.tournaments).sort((a, b) => b.createdAt - a.createdAt);
  let h = "";
  if (!all.length) return `<section class="card empty"><h2>No tournaments yet</h2><p class="muted">Finished and running tournaments show up here with their results.</p></section>`;
  const wins = {};
  all.filter(T => T.stage === "done" && T.champion).forEach(T => wins[T.champion] = (wins[T.champion] || 0) + 1);
  const champs = Object.entries(wins).sort((a, b) => b[1] - a[1] || pname(a[0]).localeCompare(pname(b[0])));
  if (champs.length) h += `<section class="card"><h3>Tournament wins</h3><ul class="board">${champs.map(([id, n], i) =>
    `<li><span class="rk">${i + 1}</span><span class="nm">${esc(pname(id))}</span><span class="pts num">${n}</span></li>`).join("")}</ul></section>`;
  // Player stats counting tournament hands only (all tournaments, or one picked)
  if (ui.tStat !== "all" && !S.tournaments[ui.tStat]) ui.tStat = "all";
  const tsel = ui.tStat === "all" ? allHands().filter(x => x.tournamentId && S.tournaments[x.tournamentId]) : tHands(S.tournaments[ui.tStat]);
  const tlist = rankList(statsFor(tsel, S.settings)).filter(s => s.played > 0);
  h += `<section class="card"><div class="row between"><h2>Tournament stats</h2><span class="muted small num">${tsel.length} hand${tsel.length === 1 ? "" : "s"}</span></div>
    <select id="tStatPick" data-change="tStat" aria-label="Which tournament">${[["all", "All tournaments"], ...all.map(T => [T.id, `${T.name} · ${niceDate(T.date)}`])].map(([k, l]) =>
      `<option value="${esc(k)}" ${k === ui.tStat ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>
    <p class="muted small">Counts tournament hands only${ui.tStat === "all" ? "" : ", qualifying and final together"}.</p>`;
  // Tournaments ignore ranked/provisional: everyone who played is shown
  h += !tlist.length ? `<p class="muted">No tournament hands recorded yet.</p>`
    : sortBar() + boardRows(sortStats(tlist), { full: "t-" + ui.tStat, noProv: true }) + `<p class="muted small">Tap a player for their full stats.</p>`;
  h += `</section>`;
  for (const T of all) {
    const open = ui.tOpen?.[T.id] ?? false;
    const handCount = tHands(T).length;
    const summary = T.stage === "done" ? `<span class="badge">Finished</span> Champion: <b>${esc(pname(T.champion))}</b>`
      : T.paused ? `<span class="badge warn">Paused</span> ${stageLabel(T).replace("Paused · ", "")}` : `<span class="badge">Live</span> ${stageLabel(T)}`;
    h += `<div class="night"><button data-act="toggleT" data-t="${T.id}" aria-expanded="${open}"><span><h2>${esc(T.name)}</h2><span class="muted small">${niceDate(T.date)} · ${(T.playerIds || []).length} players · ${handCount} hand${handCount === 1 ? "" : "s"}</span><div class="small">${summary}</div></span><span aria-hidden="true">${open ? "▾" : "▸"}</span></button>`;
    if (open) {
      h += `<div class="body stack">`;
      if (T.stage === "final" || T.stage === "done") h += `<div><h3>Final table</h3>${boardRows(tStandings(T, "final"), { tie: true })}</div>`;
      h += `<div><h3>Qualifying (${T.qualRounds} round${T.qualRounds === 1 ? "" : "s"} of ${T.handsPerRound} hands)</h3>${boardRows(tStandings(T, "qual"), { tie: true, cut: 4 })}</div>`;
      h += tourneyHands(T);
      if (S.isAdmin && T.stage !== "done") h += tournamentAdmin(T);
      if (T.stage !== "done" && !T.paused) h += `<button class="btn link" data-act="viewT" data-t="${T.id}">Open in Tourney tab</button>`;
      h += `</div>`;
    }
    h += `</div>`;
  }
  return h + rulesNote();
}
VIEWS.thistory = () => { ui.tab = "scores"; ui.scope = "tourney"; return VIEWS.scores(); };

function nightBlock(d, open, title) {
  const hs = [...S.nights[d].hands].sort((a, b) => b.ts - a.ts);
  const tn = [...new Set(hs.filter(x => x.tournamentId).map(x => S.tournaments[x.tournamentId]?.name).filter(Boolean))];
  let h = `<div class="night"><button data-act="toggleNight" data-d="${d}" aria-expanded="${open}"><span><h2>${title || nightLabel(d)}</h2><span class="muted small">${hs.length} hand${hs.length === 1 ? "" : "s"}${tn.length ? " · " + esc(tn.join(", ")) : ""}</span></span><span aria-hidden="true">${open ? "▾" : "▸"}</span></button>`;
  if (open) h += `<div class="body"><ul class="hands">${hs.map(x => {
    const dl = handDeltas(x, S.settings);
    const T = x.tournamentId && S.tournaments[x.tournamentId];
    return `<li><span class="t">${timeOf(x.ts)}</span><span class="d">${handLine(x)}<div class="sub">${esc(x.tableName || "")}${T ? ` · ${esc(T.name)} ${x.stage === "final" ? "final" : ""} R${x.round}` : ""}</div>${S.isAdmin ? `<div class="row"><button class="btn link" data-act="editHand" data-d="${d}" data-id="${x.id}">Edit</button>${confirmBtn("del:" + x.id, "Delete", "Tap again to delete", "deleteHand", `data-d="${d}" data-id="${x.id}"`, "btn link")}</div>` : ""}</span><span class="v ${cls(dl[x.winner] || 0)}">${x.draw ? "—" : fmt(dl[x.winner] || 0)}</span></li>`;
  }).join("")}</ul></div>`;
  return h + `</div>`;
}
// Hands tab: tonight's hands first (always open), then every earlier night
VIEWS.hands = () => {
  const N = curNight(), today = N ? N.id : null;
  const dates = Object.keys(S.nights).filter(d => S.nights[d].hands?.length).sort().reverse();
  let h = `<div class="stack">`;
  if (!N) h += nightCard(true);
  else h += dates.includes(today)
    ? nightBlock(today, ui.histOpen[today] ?? true, "Tonight · " + nightLabel(today))
    : `<section class="card empty"><h2>Tonight · ${nightLabel(today)}</h2><p class="muted">No hands recorded yet tonight.</p></section>`;
  if (!S.isAdmin && dates.length) h += `<p class="muted small">Spotted a mistake? Only the admin can edit or delete hands.</p>`;
  const older = dates.filter(d => d !== today);
  h += `<h3>Hand history</h3>`;
  if (!older.length) h += `<p class="muted">Earlier game nights will show up here.</p>`;

function newTournamentForm() {

    <div class="row"><button class="btn" data-act="createT" ${n >= 8 && n % 4 === 0 && curNight() ? "" : "disabled"}>Start tournament</button>${ui.newT ? `<button class="btn link" data-act="cancelT">Cancel</button>` : ""}</div></section>`;
}
function tournamentView(T) {
  let h = `<section class="card"><div class="row between"><h2 class="grow">${esc(T.name)}</h2><span class="badge ${T.paused ? "warn" : ""}">${T.stage === "done" ? "Finished" : T.paused ? "Paused" : "Live"}</span></div><p class="muted">${niceDate(T.date)} · ${stageLabel(T)}</p>`;
  if (T.paused) h += `<p class="note warn">This tournament is paused. Its tables are closed until the admin resumes it.</p>`;
  if (T.stage === "done") h += `<p class="note">Champion: <b>${esc(pname(T.champion))}</b></p>`;
  // live tables
  if (T.stage !== "done") {
    const tbls = (T.tableIds || []).map(id => S.tables[id]).filter(Boolean);
    h += tbls.map(t => { const n = roundCount(T, t.id); const done = n >= T.handsPerRound;
      return `<div class="note ${done ? "" : "warn"}"><div class="row between"><b>${esc(t.name)}</b><span class="num small">${done ? "✓ " : ""}${n} / ${T.handsPerRound} hands</span></div><div class="small">${t.seats.map(p => esc(pname(p))).join(" · ")}</div></div>`; }).join("");
  }
  h += `</section>`;
  if (T.stage === "final" || T.stage === "done") {
    const fl = tStandings(T, "final");
    h += `<section class="card"><h2>Final table</h2>${boardRows(fl, { tie: true, T, stage: "final" })}${rulesNote()}</section>`;
  }
  const ql = tStandings(T, "qual");
  h += `<section class="card"><div class="row between"><h2>${T.stage === "qual" ? "Live leaderboard" : "Qualifying standings"}</h2></div>${T.stage === "qual" ? `<p class="muted small">Dashed line marks the final-table cut (top 4).</p>` : ""}${boardRows(ql, { tie: true, T, stage: "qual", cut: 4 })}${T.stage === "qual" ? rulesNote() : ""}</section>`;
  h += tourneyHands(T);
  if (S.isAdmin && T.stage !== "done") h += tournamentAdmin(T);
  return h;
}
function tourneyHands(T) {
  const hs = tHands(T).slice().reverse();
  const open = ui.tHandsOpen?.[T.id];
  let h = `<section class="card"><div class="row between"><h2>Hand history</h2><button class="btn ghost" data-act="toggleTHands" data-t="${T.id}">${open ? "Hide" : `Show all ${hs.length} hand${hs.length === 1 ? "" : "s"}`}</button></div>`;
  if (open) h += hs.length ? `<ul class="hands">${hs.map(x => {
    const dl = handDeltas(x, S.settings);
    return `<li><span class="t">${timeOf(x.ts)}</span><span class="d">${handLine(x)}<div class="sub">${x.stage === "final" ? "Final" : "Qualifying"} round ${x.round} · ${esc(x.tableName || "")} · ${nightLabel(x.night)}</div>${S.isAdmin ? `<div class="row"><button class="btn link" data-act="editHand" data-d="${x.night}" data-id="${x.id}">Edit</button>${confirmBtn("del:" + x.id, "Delete", "Tap again to delete", "deleteHand", `data-d="${x.night}" data-id="${x.id}"`, "btn link")}</div>` : ""}</span><span class="v ${cls(dl[x.winner] || 0)}">${x.draw ? "—" : fmt(dl[x.winner] || 0)}</span></li>`;
  }).join("")}</ul>` : `<p class="muted">No hands recorded in this tournament yet.</p>`;
  return h + `</section>`;
}
function tournamentAdmin(T) {
  const tbls = (T.tableIds || []).map(id => S.tables[id]).filter(Boolean);
  const incomplete = tbls.some(t => roundCount(T, t.id) < T.handsPerRound);
  let label;
  if (T.stage === "qual") label = T.round < T.qualRounds ? `Start round ${T.round + 1} (snake seating)` : "Start the final table";
  else label = T.round < T.finalRounds ? `Start final round ${T.round + 1}` : "Finish tournament";
  const key = "adv:" + T.id;
  const btn = T.paused ? (curNight() ? `<button class="btn" data-act="resumeT" data-t="${T.id}">Resume tournament</button>`
      : `<button class="btn" disabled>Resume tournament</button><span class="muted small">Begin a game night to resume. <button class="btn link" data-act="beginNight">Begin tonight</button></span>`)
    : incomplete
    ? confirmBtn(key, label, "Not every table has finished. Tap again to continue anyway", "advanceT", `data-t="${T.id}"`, "btn")
    : `<button class="btn" data-act="advanceT" data-confirmed="1" data-t="${T.id}">${label}</button>`;
  const pause = T.paused ? "" : confirmBtn("pause:" + T.id, "Pause tournament", "Tap again to pause and close its tables", "pauseT", `data-t="${T.id}"`);
  return `<section class="card"><h3>Admin controls</h3><div class="row">${btn}${pause}</div>
    <div class="fields">
      <label>Name<input type="text" id="eName-${T.id}" data-model="eName" maxlength="60" value="${esc(ui.d.eName ?? T.name)}"></label>
      <label>Date<input type="date" id="eTDate-${T.id}" data-model="eTDate" value="${esc(ui.d.eTDate ?? T.date)}"></label>
      <label>Current round<input type="number" id="eRound-${T.id}" data-model="eRound" min="1" max="20" value="${esc(ui.d.eRound ?? T.round)}"></label>
      <label>Hands per round<input type="number" id="eHpr" data-model="eHpr" min="1" max="99" value="${esc(ui.d.eHpr ?? T.handsPerRound)}"></label>
      <label>Qualifying rounds<input type="number" id="eQr" data-model="eQr" min="1" max="20" value="${esc(ui.d.eQr ?? T.qualRounds)}"></label>
      <label>Final table rounds<input type="number" id="eFr" data-model="eFr" min="1" max="20" value="${esc(ui.d.eFr ?? T.finalRounds)}"></label>
    </div><div><button class="btn ghost" data-act="saveTSettings" data-t="${T.id}">Save changes</button></div>
    <p class="muted small">Change the current round if you need to replay or skip one. Tournament seating can be changed on the Tables tab. Tied players show ▲▼ so you can set the order once the tie-breaks run out.</p></section>`;
}

VIEWS.settings = () => {

  if (S.isAdmin) {
    const { st } = eloState(), sug = unrankSuggestions();

    h += `<section class="card"><h2>Rating status</h2>
      <p class="muted small">Players become ranked automatically after ${ELO.minHands} hands or once their RD drops to ${ELO.rdRanked}. Nobody is made provisional automatically. A player you make provisional goes back to ranked by themselves once their RD is back to ${ELO.rdRanked} or lower after a hand.</p>

    h += sug.length ? `<ul class="seats">${sug.map(x => `<li><span class="grow">${esc(pname(x.id))}<br><span class="muted small">RD ${Math.round(x.rd)} · missed ${x.missed} night${x.missed === 1 ? "" : "s"} in a row</span></span>${confirmBtn("dem-" + x.id, "Make provisional", "Tap to confirm", "demote", `data-id="${x.id}"`, "btn link")}</li>`).join("")}</ul>`
      : `<p class="muted small">None right now. Ranked players show up here after missing ${ELO.inactiveNights} or more nights in a row, or if their RD climbs above ${ELO.rdSuggest}.</p>`;
    if (manual.length) h += `<h3>Made provisional by you</h3><ul class="seats">${manual.map(x => `<li><span class="grow">${esc(pname(x.id))}<br><span class="muted small">RD ${Math.round(x.rd)}${x.rd <= ELO.rdRanked ? " · back to ranked after their next hand" : `, needs ${ELO.rdRanked}`}</span></span><button class="btn link" data-act="undemote" data-id="${x.id}">Undo</button></li>`).join("")}</ul>`;
    if (rankedIds.length) h += `<h3>Make any ranked player provisional</h3><div class="inline"><select id="demPick" data-model="demPick" aria-label="Ranked player">${rankedIds.map(x => `<option value="${x.id}" ${ui.d.demPick === x.id ? "selected" : ""}>${esc(pname(x.id))} · RD ${Math.round(x.rd)}</option>`).join("")}</select><button class="btn ghost" data-act="demote" data-pick="1">Make provisional</button></div>`;

  h += `<section class="card"><h2>Backup</h2><p class="muted">Download every player, hand and tournament as a file. Keep a copy now and then.</p><div><button class="btn ghost" data-act="backup">Download backup</button></div></section>`;

  h += `</section></div>`;

function mjTile(d, suit, win) {
  const n = +d, title = suit === "z" ? HNAMES[n - 1] : suit === "f" || suit === "q" ? `${TNAMES[suit]} ${n}` : `${n} ${TNAMES[suit]}`;
  return `<span class="mt${win ? " lucky" : ""}" title="${title}" role="img" aria-label="${title}">${TILE_SVG[n + suit] || ""}</span>`;
}
function exampleHand(code) {
  if (!code) return "";
  return `<div class="eg" aria-label="Example hand">${code.split(" ").map(g => {
    const win = g.startsWith("+"), suit = g.slice(-1), ds = g.replace("+", "").slice(0, -1);
    return `<span class="grp${win ? " win" : ""}">${[...ds].map(d => mjTile(d, suit, win)).join("")}</span>`;
  }).join("")}</div>`;
}
const ruleRow = (name, f, desc, eg) => `<li>${ftile(f)}<div class="rd"><b>${esc(name)}</b>${desc ? `<span>${esc(desc)}</span>` : ""}${exampleHand(eg)}</div></li>`;

// Rules tab has two games: Classic Hong Kong (scored in the app) and Chicken Party (cash game, not recorded)
const DEALING_RULE = `<h3>Dealing</h3><ul><li><b>The dealer (East) always draws first</b>, every hand.</li></ul>`;
const STEAL_RULE = `<h3>Steal order</h3>
    <ul>
      <li>A pong (triplet) or kong (quad) takes priority over a seung (sequence/chow), unless the seung is for the win.</li>
      <li>A seung can be taken from anyone if it's for the win.</li>
    </ul>`;
const jumpChips = list => `<div class="jump">${list.map(([id, l]) => `<button class="chip" data-act="jump" data-to="${id}">${l}</button>`).join("")}</div>`;
const tileRow = tiles => `<div class="eg">${tiles.map(t => Array.isArray(t) ? `<span class="grp">${t.map(([d, su]) => mjTile(d, su)).join("")}</span>` : t).join("")}</div>`;
const hit = (d, su) => mjTile(d, su, true);

function chickenPartyView() {
  const $ = v => `<span class="cash">$${v}</span>`;
  let h = jumpChips([["r-cp", "How it works"], ["r-cp-pay", "Payouts"], ["r-cp-ex", "Examples"], ["r-table", "Table rules"], ["r-tiles", "Tile guide"]]);
  h += `<section class="card cp" id="r-cp"><h2>Chicken Party <span class="tag">Cash game</span></h2>
    <p>A quick cash game. <b>Any</b> winning hand counts, including chicken hands with no fan. Money changes hands on the spot.</p>
    <p class="note small">Chicken Party isn't recorded in the app. Settle up at the table.</p>
    <ol class="steps">
      <li><div><b>Kongs pay straight away</b><p>Declare a kong, revealed or concealed, and each other player pays you ${$(5)} on the spot.</p>
        <p>If someone robs your kong to win, you get nothing for that kong.</p></div></li>
      <li><div><b>The win</b><p>Off a discard, the discarder pays ${$(5)}. On a self-draw, everyone pays ${$(5)}.</p>
        <p>Then <b>every</b> other player, the discarder included, pays ${$(1)} for each wind or dragon pong/kong in the winning hand.</p></div></li>
      <li><div><b>Egg hunt</b><p>The winner draws bonus tiles from the back of the wall: <b>4</b> after a discard win, <b>8</b> after a self-draw. If the wall runs short, draw what's left.</p>
        <p>Every flower or season, and every 1 or 9 of any suit, is an <b>egg</b> worth ${$(5)}. The discarder pays for a discard win; everyone pays for a self-draw.</p></div></li>
    </ol></section>`;
  h += `<section class="card" id="r-cp-pay"><h2>Payouts</h2>
    <table class="pay"><thead><tr><th></th><th>Discard win</th><th>Self-draw</th></tr></thead><tbody>
      <tr><td>Kong</td><td colspan="2">Each other player pays ${$(5)}</td></tr>
      <tr><td>Win</td><td>Discarder ${$(5)}</td><td>Each player ${$(5)}</td></tr>
      <tr><td>Wind/dragon set</td><td colspan="2">Each player ${$(1)} per set</td></tr>
      <tr><td>Egg hunt</td><td>Draw 4. Discarder pays ${$(5)} an egg</td><td>Draw 8. Each player pays ${$(5)} an egg</td></tr>
    </tbody></table></section>`;
  h += `<section class="card" id="r-cp-ex"><h2>Examples</h2>
    <h3>Discard win</h3>
    <div class="worked"><p>Ada wins off Ben's discard. Her hand has a pong of red dragons and a pong of East:</p>
      ${tileRow([[[7, "z"], [7, "z"], [7, "z"]], [[1, "z"], [1, "z"], [1, "z"]], [[2, "m"], [3, "m"], [4, "m"]], [[5, "p"], [6, "p"], [7, "p"]], [[8, "s"], [8, "s"]]])}
      <p>Win: Ben pays ${$(5)}. Two honour pongs: Ben, Cass and Dee each pay ${$(2)}.</p>
      <p>Egg hunt (4 tiles), 2 eggs:</p>
      ${tileRow([hit(9, "p"), hit(1, "f"), mjTile(5, "s"), mjTile(2, "z")])}
      <p>Ben pays ${$(10)} more. Ada collects <b>$21</b>: Ben $17, Cass $2, Dee $2.</p></div>
    <h3>Self-draw</h3>
    <div class="worked"><p>Cass self-draws with one pong of green dragons. Ada, Ben and Dee each pay ${$(5)} + ${$(1)}.</p>
      <p>Egg hunt (8 tiles), 3 eggs:</p>
      ${tileRow([hit(1, "m"), mjTile(3, "p"), hit(9, "s"), mjTile(2, "z"), hit(2, "q"), mjTile(7, "m"), mjTile(2, "p"), mjTile(6, "s")])}
      <p>Each pays ${$(15)} more, so ${$(21)} each. Cass collects <b>$63</b>.</p></div>
    <p class="muted small">Eggs are outlined in green.</p></section>`;
  h += `<section class="card house" id="r-table"><h2>Table rules</h2><p class="muted small">Same as Classic Hong Kong.</p>${DEALING_RULE}${STEAL_RULE}</section>`;
  return h;
}

VIEWS.rules = () => {
  const rs = S.settings.ruleset, sd = S.settings.selfDraw;
  const m = (SELF_DRAW[sd] || SELF_DRAW.half).mult;
  let h = `<div class="stack"><div class="seg" role="tablist">${[["hk", "Classic Hong Kong"], ["chicken", "Chicken Party"]].map(([k, l]) =>
    `<button class="${ui.game === k ? "on" : ""}" data-act="game" data-game="${k}" role="tab" aria-selected="${ui.game === k}">${l}</button>`).join("")}</div>`;
  if (ui.game === "chicken") h += chickenPartyView();
  else {
  h += jumpChips([["r-hands", "Winning hands"], ["r-extra", "Extra fan"], ["r-house", "House rules"], ["r-points", "Scoring"], ["r-tiles", "Tile guide"]]);

  h += `<section class="card" id="r-hands"><h2>Winning hands</h2>
    <p>You need at least <b>${MIN_FAN} fan</b> to win. Add up your winning hand and any extra fan. Limit hands, and anything that adds up past the limit, score <b>${LIMIT_FAN} fan</b>.</p>
    <p class="muted small">A tile after a dashed line is the winning tile. Not sure which tile is which? See the <button class="btn link" data-act="jump" data-to="r-tiles">Tile guide</button>.</p>
    <ul class="rules">${WIN_HANDS.map(([n, f, d, e]) => ruleRow(n, f, d, e)).join("")}</ul></section>`;

  h += `<section class="card" id="r-extra"><h2>Extra fan</h2><p class="muted small">Added on top of your winning hand.</p><ul class="rules">${EXTRA_FAN.map(([n, f, d]) => ruleRow(n, f, d)).join("")}</ul></section>`;

  h += `<section class="card house" id="r-house"><h2>House rules</h2>
    ${DEALING_RULE}
    <h3>Kongs</h3>
    <ul>
      <li>A kong can be declared at any time.</li>
      <li><b>Fong rule:</b> each kong, revealed or concealed, is worth 1 fan.
        <ul>
          <li>Out on Replacement Tile (second-last row of Extra fan) still applies.</li>
          <li>Kongs in a row, then drawing the winning tile: <b>+8 fan</b>.</li>
          <li>Winning on a replacement tile doesn't also earn the Self-Draw fan.</li>
        </ul>
      </li>
    </ul>
    <p class="note warn small">These kong rules are our own and differ from traditional Hong Kong or Chinese rules.</p>
    ${STEAL_RULE}</section>`;

  h += `<section class="card" id="r-points"><h2>Scoring rules</h2>`;
  if (S.isAdmin) h += `<div class="fields"><label>Ruleset<select id="rsPick" data-change="ruleset">${Object.entries(RULESETS).map(([k, v]) => `<option value="${k}" ${k === rs ? "selected" : ""}>${esc(v.name)}</option>`).join("")}</select></label>
      <label>Self-draw<select id="sdPick" data-change="selfDraw">${Object.entries(SELF_DRAW).map(([k, v]) => `<option value="${k}" ${k === sd ? "selected" : ""}>${esc(v.name)}</option>`).join("")}</select></label></div>
      <p class="muted small">Changing either setting recalculates every score, daily and all-time.</p>`;
  else h += `<p><b>${esc(RULESETS[rs]?.name)}</b> · self-draw: ${esc((SELF_DRAW[sd] || SELF_DRAW.half).name.toLowerCase())}</p>`;
  h += `<p class="muted small">The discarder pays the full amount. On a self-draw, ${m === 1 ? "each other player pays the full amount" : "each other player pays half"}.</p>
    <div class="scroll"><table class="fantable"><thead><tr><th>Fan</th><th>Discarder pays</th><th>Self-draw, each pays</th><th>Self-draw, winner gets</th></tr></thead><tbody>${fanRange().map(f => { const b = basePoints(f, rs);
      return `<tr><td>${f}${f === LIMIT_FAN ? " (limit)" : ""}</td><td>${num(b)}</td><td>${num(b * m)}</td><td>${num(b * m * 3)}</td></tr>`; }).join("")}</tbody></table></div></section>`;
  }
  const fig = (tile, cap) => `<figure>${tile}<figcaption>${cap}</figcaption></figure>`;
  h += `<section class="card" id="r-tiles"><h2>Tile guide</h2><div class="tguide">
    <div><h3>Characters 萬</h3><p class="muted small">The top of each tile is a Chinese number from 1 to 9.</p></div>
    <div class="trow">${NUMS.map((_, i) => fig(mjTile(i + 1, "m"), `<b>${i + 1}</b>`)).join("")}</div>
    <h3>Dots 筒</h3>
    <div class="trow">${NUMS.map((_, i) => fig(mjTile(i + 1, "p"), `<b>${i + 1}</b>`)).join("")}</div>
    <h3>Bamboo 索</h3>
    <div class="trow">${NUMS.map((_, i) => fig(mjTile(i + 1, "s"), `<b>${i + 1}</b>`)).join("")}</div>
    <h3>Winds and dragons</h3>
    <div class="trow short">${HNAMES.map((nm, i) => fig(mjTile(i + 1, "z"), nm.replace(" dragon", ""))).join("")}</div>
    <h3>Flowers (left) and seasons (right)</h3>
    <div class="trow">${[1, 2, 3, 4].map(n => fig(mjTile(n, "f"), WINDS[n - 1])).join("")}<span></span>${[1, 2, 3, 4].map(n => fig(mjTile(n, "q"), WINDS[n - 1])).join("")}</div>
    <p class="muted small">Each flower and season belongs to the seat wind shown under it.</p>

};

// ---------- toast & modal ----------

  el.hidden = false; toast.undo = undo;

}
const modal = document.getElementById("modal");

// ---------- actions ----------
const run = async (p, okMsg, undo) => {
  try { await p; if (okMsg) toast(okMsg, false, undo); }
  catch (e) { console.error(e); toast(e?.code === "permission-denied"
    ? (S.isAdmin ? `The database didn't accept you as admin. Check the rules published in Firebase use ${S.user?.email}.` : "Not allowed. That needs the admin account.")
    : "Couldn't save: " + (e?.message || e), true); }
};
function draftReset() { ui.winner = null; ui.from = null; ui.fan = null; }
function buildHand(t, part) {
  const ts = Date.now();
  const N = curNight();
  return { id: newId(), ts, date: N ? N.date : sydDate(ts), night: N ? N.id : sydDate(ts), tableId: t.id, tableName: t.name, seats: [...t.seats], winner: null, discarder: null, selfDraw: false, draw: false, fan: null,
    tournamentId: t.tournamentId || null, stage: t.stage || null, round: t.round || null, ...part };
}
// Start a game night if none is running (admin). Key is the date; a second night on the same date gets "-2", "-3"...
async function ensureNight() {
  if (curNight()) return;
  const now = Date.now(), date = sydDate(now);
  let id = date, n = 1;
  while (S.nights[id] && (S.nights[id].endedAt || S.nights[id].startedAt)) id = `${date}-${++n}`;
  await store.saveNight(id, { date, startedAt: now });
  await store.setSettings({ night: { id, date, startedAt: now } });
}
async function pauseTournament(T) {
  const tbls = (T.tableIds || []).map(id => S.tables[id]).filter(Boolean);
  const pausedTables = tbls.map(t => ({ id: t.id, name: t.name, seats: t.seats }));
  for (const t of tbls) await store.updateTable(t.id, { open: false });
  await store.saveTournament(T.id, { paused: true, pausedAt: Date.now(), pausedTables });
}
// Take players off any other open table (so nobody sits at two tables at once)
async function unseatElsewhere(ids, keepTableIds) {
  for (const t of openTables()) {
    if (keepTableIds.includes(t.id)) continue;
    const left = t.seats.filter(p => !ids.includes(p));
    if (left.length !== t.seats.length) await store.updateTable(t.id, { seats: left });
  }
}

  async deleteHand(d) { await run(store.replaceHand(d.d, d.id, null), "Hand deleted"); },
  async addPlayer() {

  cancelName() { ui.d.editing = null; },

  async toggleActive(d) { await run(store.updatePlayer(d.id, { active: S.players[d.id].active === false })); },
  async signIn() { await run(store.signInAdmin()); },
  async signOut() { await run(store.signOut(), "Signed out"); },
  resetDemo() { store.reset(); toast("Demo data reset"); },
  backup() {
    const data = { exportedAt: new Date().toISOString(), settings: S.settings, players: S.players, tournaments: S.tournaments, hands: allHands() };
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
    a.download = `fong-gambling-den-backup-${sydDate(Date.now())}.json`; document.body.appendChild(a); a.click(); a.remove();
  },
  undo() { const u = toast.undo; document.getElementById("toast").hidden = true; if (u) run(u(), "Undone"); return "keep"; },
  newT() { ui.newT = true; },
  cancelT() { ui.newT = false; },
  viewT(d) { ui.tView = d.t; ui.newT = false; ui.tab = "tourney"; history.replaceState(null, "", "#tourney"); window.scrollTo(0, 0); },
  goTourneys() { ui.tab = "scores"; ui.scope = "tourney"; history.replaceState(null, "", "#scores"); window.scrollTo(0, 0); },
  toggleT(d) { ui.tOpen = ui.tOpen || {}; ui.tOpen[d.t] = !ui.tOpen[d.t]; },
  async createT() {
    const ids = ui.d.tPlayers || [];
    if (ids.length < 8 || ids.length % 4) return;
    if (!curNight()) return toast("Begin tonight's game night first. Tournaments run inside a night.", true);
    const today = curNight().date;
    const name = (ui.d.tName || "").trim() || `Tournament ${niceDate(today)}`;
    const hpr = Math.max(1, +ui.d.tHpr || 4), qr = Math.max(1, +ui.d.tQr || 3), fr = Math.max(1, +ui.d.tFr || 1);

      const tid = await store.saveTournament(null, { name, date: today, createdAt: Date.now(), playerIds: ids, handsPerRound: hpr, qualRounds: qr, finalRounds: fr, stage: "qual", round: 1, tableIds: [], finalists: [], tieOrder: [], champion: null });

  async advanceT(d) {

        await store.saveTournament(T.id, { round: T.round + 1 });
        toast(`Final round ${T.round + 1} started`);
      } else {
        const champion = tStandings(T, "final")[0]?.id || null;

      }

  },
  async saveTSettings(d) {

    const p = { name: (ui.d.eName ?? T.name).trim() || T.name, date: /^\d{4}-\d{2}-\d{2}$/.test(td) ? td : T.date, round: Math.max(1, Math.round(+(ui.d.eRound ?? T.round)) || 1),
