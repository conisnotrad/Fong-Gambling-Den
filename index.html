<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fong Gambling Den</title>
<meta name="theme-color" content="#0f6b52">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-first column on a jade-felt ground; fan picker drawn as a rack of tiles; tab bar along the bottom edge */
:root{
  --bg:#e7ece9; --surface:#f8faf8; --surface-2:#dde6e1; --ink:#14201b; --muted:#56675f; --line:#c7d3cc;
  --jade:#0f6b52; --jade-ink:#ffffff; --jade-soft:#d2e7de;
  --pos:#0d7650; --neg:#b3361d; --warn:#9a6200;
  --tile:#fbfaf3; --tile-edge:#0f6b52; --tile-ink:#14201b;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1411; --surface:#141f1b; --surface-2:#1c2a24; --ink:#e3ebe7; --muted:#92a49c; --line:#2a3a33;
    --jade:#3cb38b; --jade-ink:#05130e; --jade-soft:#173a2e;
    --pos:#4fd1a0; --neg:#ff7f66; --warn:#f0b44c;
    --tile:#eeebe0; --tile-edge:#2f9f7a; --tile-ink:#14201b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1411; --surface:#141f1b; --surface-2:#1c2a24; --ink:#e3ebe7; --muted:#92a49c; --line:#2a3a33;
  --jade:#3cb38b; --jade-ink:#05130e; --jade-soft:#173a2e;
  --pos:#4fd1a0; --neg:#ff7f66; --warn:#f0b44c;
  --tile:#eeebe0; --tile-edge:#2f9f7a; --tile-ink:#14201b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.mark{width:30px;height:38px;border-radius:6px;background:var(--tile);color:var(--jade);border:1px solid var(--line);border-bottom:5px solid var(--tile-edge);display:grid;place-items:center;font:20px/1 var(--display);flex:none}
.brand{font:20px/1.1 var(--display);margin:0;flex:1;min-width:0}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.admin{background:var(--jade);color:var(--jade-ink)}
.pill.demo{background:var(--warn);color:var(--surface)}

.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
h2{font:19px/1.2 var(--display);margin:0;text-wrap:balance}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.empty{align-items:flex-start}
.note{background:var(--jade-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.note.warn{background:var(--surface-2);border-left:4px solid var(--warn)}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:-6px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600}
.chip.on{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.chip .cnt{font-weight:500;opacity:.75;font-variant-numeric:tabular-nums;margin-left:4px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 2px;font-weight:600;font-size:13.5px;color:var(--muted);min-width:0;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.span2{grid-column:1/-1}
.pbtn{min-height:54px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:600;font-size:16px;text-align:left;display:flex;flex-direction:column;justify-content:center;min-width:0;overflow-wrap:anywhere}
.pbtn small{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pbtn.on{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.pbtn.on small{color:inherit;opacity:.8}
.pbtn.self{border-style:dashed}
.pbtn.self.on{border-style:solid}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.tile{background:var(--tile);color:var(--tile-ink);border:1px solid var(--line);border-bottom:6px solid var(--tile-edge);border-radius:9px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s}
.tile b{font:22px/1 var(--display)}
.tile span{font-size:11px;font-variant-numeric:tabular-nums;color:#5a6b63}
.tile.on{transform:translateY(-5px);background:var(--jade);color:#fff;border-bottom-color:#08402f}
.tile.on span{color:#d8efe6}

.preview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.preview div{display:flex;justify-content:space-between;gap:8px;min-width:0}
.preview span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
b.pos,.pos{color:var(--pos)} b.neg,.neg{color:var(--neg)} .zero{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.btn{border:0;background:var(--jade);color:var(--jade-ink);border-radius:11px;padding:10px 16px;font-weight:700}
.btn.big{padding:15px 18px;font-size:17px;width:100%}
.btn.ghost{background:transparent;color:var(--jade);border:1px solid var(--line)}
.btn.danger{background:var(--neg);color:var(--surface)}
.btn.link{background:none;color:var(--jade);padding:4px 2px;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;flex-direction:column;gap:8px}

input[type=text],input[type=number],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;max-width:100%}
input[type=number]{width:80px}
.inline{display:flex;gap:8px}
.inline > input,.inline > select{flex:1}

.seats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.seats li{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:8px 8px 8px 12px;font-weight:600}
.seats li .grow{overflow-wrap:anywhere}
.x{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:15px}
.x:hover{background:var(--surface);color:var(--neg)}
.badge{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--jade-soft);color:var(--jade)}
.badge.warn{background:var(--surface-2);color:var(--warn)}

.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.board li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:11px 2px;border-top:1px solid var(--line)}
.board li:first-child{border-top:0}
.board .rk{font:18px/1 var(--display);color:var(--muted);text-align:center}
.board li:nth-child(1) .rk{color:var(--jade)}
.board .nm{font-weight:700;overflow-wrap:anywhere}
.board .pts{font:20px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.board .meta{grid-column:2/-1;font-size:13px;color:var(--muted)}
.board li.cut{border-top:2px dashed var(--jade)}
.tiebtns{display:inline-flex;gap:2px;margin-left:6px;vertical-align:middle}
.tiebtns button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:26px;height:24px;font-size:11px;padding:0}

.hands{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hands li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.hands li:first-child{border-top:0}
.hands .t{font-size:12px;color:var(--muted);width:58px;flex:none;padding-top:2px;font-variant-numeric:tabular-nums}
.hands .d{flex:1;min-width:0;overflow-wrap:anywhere}
.hands .d .sub{font-size:13px;color:var(--muted)}
.hands .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.night{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.night > button{width:100%;display:flex;gap:10px;align-items:center;justify-content:space-between;border:0;background:transparent;padding:14px 16px;text-align:left}
.night > button h2{font-size:17px}
.night .body{padding:0 16px 12px}

.fantable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.fantable th,.fantable td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.fantable th:first-child,.fantable td:first-child{text-align:left}
.fantable th{font-size:12px;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}

.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.checks label{display:flex;gap:8px;align-items:center;background:var(--surface-2);padding:8px 10px;border-radius:9px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabs button{border:0;background:transparent;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabs button .ic{font:17px/1 var(--display);width:30px;height:26px;display:grid;place-items:center;border-radius:7px}
.tabs button.on{color:var(--jade)}
.tabs button.on .ic{background:var(--jade);color:var(--jade-ink)}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.err{background:var(--neg);color:#fff}
#toast button{border:0;background:transparent;color:inherit;text-decoration:underline;font-weight:700}
.modal-bg{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:grid;place-items:end center;padding:16px}
.modal{background:var(--surface);border-radius:16px;padding:18px;width:100%;max-width:520px;max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (min-width:520px){.pgrid{grid-template-columns:repeat(4,1fr)} .pgrid .pbtn.self{grid-column:span 1}}
</style>
</head>

<main class="wrap" id="app"><div class="loading">Loading the den…</div></main>
<nav class="tabs" aria-label="Sections"><div class="tabs-in" id="tabs"></div></nav>
<div id="toast" hidden></div>
<div id="modal"></div>

<script type="module">
// ============================================================
//  CONFIG — paste your Firebase details here (see SETUP.md)
// ============================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBKJLVXt_FOjV_HtpU34gFEW6zBHhbIO7k",
  authDomain: "fong-gambling-den.firebaseapp.com",
  projectId: "fong-gambling-den",
  storageBucket: "fong-gambling-den.firebasestorage.app",
  messagingSenderId: "442207096169",
  appId: "1:442207096169:web:22fbb47908957be9fc81f8"
};
// Your Google account email. Must match the one in firestore.rules.
const ADMIN_EMAIL = "conisnotrad@gmail.com";
// ============================================================

const DEMO = !FIREBASE_CONFIG.apiKey;
const TZ = "Australia/Sydney";
const MIN_FAN = 3, MAX_FAN = 13;
const WINDS = ["East", "South", "West", "North"];
const LETTERS = "ABCDEFGHIJKLMNOP";

// Points for 3..13 fan. Points are always recalculated from the current ruleset, so changing it rewrites every total.
const RULESETS = {
  uts10:   { name: "UTS 10x Scaled", pts: [2, 4, 6, 8, 12, 16, 24, 32, 48, 64, 96] },
  uts:     { name: "UTS",            pts: [0.2, 0.4, 0.6, 0.8, 1.2, 1.6, 2.4, 3.2, 4.8, 6.4, 9.6] },
  hkSpicy: { name: "HK Spicy",       pts: [8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192] },
  hkHalf:  { name: "HK Half",        pts: [8, 16, 24, 32, 48, 64, 96, 128, 192, 256, 384] },
};
const SELF_DRAW = {
  half: { name: "Each pays half (winner gets 1.5×)", mult: 0.5 },
  full: { name: "Each pays full (winner gets 3×)", mult: 1 },
};

// ---------- helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const newId = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-5);
const r2 = x => Math.round(x * 100) / 100;
const num = x => r2(x).toLocaleString("en-AU", { maximumFractionDigits: 2 });
const fmt = x => { const v = r2(x); return (v > 0 ? "+" : v < 0 ? "−" : "") + num(Math.abs(v)); };
const cls = x => r2(x) > 0 ? "pos" : r2(x) < 0 ? "neg" : "zero";
const sydDate = ts => new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(ts));
const niceDate = d => { const [y, m, dd] = d.split("-").map(Number); return new Date(Date.UTC(y, m - 1, dd)).toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }); };
const timeOf = ts => new Date(ts).toLocaleTimeString("en-AU", { timeZone: TZ, hour: "numeric", minute: "2-digit" });
const fanRange = () => Array.from({ length: MAX_FAN - MIN_FAN + 1 }, (_, i) => MIN_FAN + i);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

// ---------- scoring ----------
function basePoints(fan, ruleset) {
  const t = (RULESETS[ruleset] || RULESETS.uts10).pts;
  const f = Math.min(MAX_FAN, Math.max(MIN_FAN, Math.round(fan)));
  return t[f - MIN_FAN];
}
// Point changes for one hand: {playerId: delta}
function handDeltas(h, settings) {
  const d = {};
  if (h.draw || !h.winner) return d;
  const b = basePoints(h.fan, settings.ruleset);
  if (h.selfDraw) {
    const m = (SELF_DRAW[settings.selfDraw] || SELF_DRAW.half).mult;
    const others = (h.seats || []).filter(p => p !== h.winner);
    others.forEach(p => d[p] = -b * m);
    d[h.winner] = b * m * others.length;
  } else {
    d[h.winner] = b;
    if (h.discarder) d[h.discarder] = -b;
  }
  return d;
}
const blankStats = id => ({ id, pts: 0, played: 0, wins: 0, selfDraws: 0, dealIns: 0, draws: 0, fanTotal: 0, bestFan: 0, nights: new Set() });
function statsFor(hands, settings, ids = []) {
  const m = {};
  const get = id => m[id] || (m[id] = blankStats(id));
  ids.forEach(get);
  for (const h of hands) {
    (h.seats || []).forEach(p => { const s = get(p); s.played++; s.nights.add(h.date); if (h.draw) s.draws++; });
    if (h.draw || !h.winner) continue;
    const d = handDeltas(h, settings);
    for (const p in d) get(p).pts += d[p];
    const w = get(h.winner);
    w.wins++; w.fanTotal += h.fan; w.bestFan = Math.max(w.bestFan, h.fan);
    if (h.selfDraw) w.selfDraws++;
    if (h.discarder) get(h.discarder).dealIns++;
  }
  return m;
}
// Tie-breaks: points, then lower total fan, then higher best hand, then fewer deal-ins, then admin's manual order.
function rankList(statsMap, tieOrder = []) {
  const ti = id => { const i = tieOrder.indexOf(id); return i < 0 ? 1e9 : i; };
  return Object.values(statsMap).sort((a, b) =>
    r2(b.pts) - r2(a.pts) || a.fanTotal - b.fanTotal || b.bestFan - a.bestFan || a.dealIns - b.dealIns ||
    ti(a.id) - ti(b.id) || pname(a.id).localeCompare(pname(b.id)));
}
const sameMetrics = (a, b) => r2(a.pts) === r2(b.pts) && a.fanTotal === b.fanTotal && a.bestFan === b.bestFan && a.dealIns === b.dealIns;
// Snake seating: rank 1..n laid out across tables, reversing direction each row (8 players: A = 1,4,5,8; B = 2,3,6,7)
function snakeSeat(rankedIds, nTables) {
  const tables = Array.from({ length: nTables }, () => []);
  rankedIds.forEach((id, i) => {
    const row = Math.floor(i / nTables), pos = i % nTables;
    tables[row % 2 === 0 ? pos : nTables - 1 - pos].push(id);
  });
  return tables;
}

// ---------- state ----------
const S = { ready: false, user: null, isAdmin: false, players: {}, tables: {}, nights: {}, settings: { ruleset: "uts10", selfDraw: "half" }, tournaments: {} };
const ui = { tab: "record", tableId: lsGet("fgd-table"), winner: null, from: null, fan: null, scope: "today", date: null, histOpen: {}, histLimit: 15, confirm: null, tView: null, newT: false, d: {} };
const validTabs = ["record", "tables", "scores", "history", "thistory", "tourney", "settings"];
if (validTabs.includes(location.hash.slice(1))) ui.tab = location.hash.slice(1);

const pname = id => S.players[id]?.name || "Unknown player";
const openTables = () => Object.values(S.tables).filter(t => t.open).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
let _hands = null;
const allHands = () => _hands || (_hands = Object.values(S.nights).flatMap(n => n.hands || []).sort((a, b) => a.ts - b.ts));
const activePlayers = () => Object.values(S.players).filter(p => p.active !== false).sort((a, b) => a.name.localeCompare(b.name));

// ---------- tournament helpers ----------
const tHands = (T, stage) => allHands().filter(h => h.tournamentId === T.id && (!stage || h.stage === stage));
function tStandings(T, stage) {
  const ids = stage === "final" ? (T.finalists || []) : (T.playerIds || []);
  return rankList(statsFor(tHands(T, stage), S.settings, ids), T.tieOrder || []);
}
const roundCount = (T, tableId) => tHands(T, T.stage).filter(h => h.round === T.round && h.tableId === tableId).length;
const stageLabel = T => T.stage === "done" ? "Finished" : (T.paused ? "Paused · " : "") +
  `${T.stage === "final" ? "Final" : "Qualifying"} · Round ${T.round} of ${T.stage === "final" ? T.finalRounds : T.qualRounds} · ${WINDS[(T.round - 1) % 4]} wind`;
const activeTournaments = () => Object.values(S.tournaments).filter(T => T.stage !== "done").sort((a, b) => b.createdAt - a.createdAt);

// ---------- stores ----------
async function makeFirebaseStore() {
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [{ initializeApp }, A, F] = await Promise.all([
    import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
  const app = initializeApp(FIREBASE_CONFIG);
  const auth = A.getAuth(app);
  let db;
  try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch { db = F.getFirestore(app); }
  const col = n => F.collection(db, n);
  return {
    start(onChange) {
      const fail = e => { console.error(e); S.loadError = (e.code || "") + " " + (e.message || ""); toast("Couldn't load data: " + (e.code || e.message), true); onChange(); };
      // If nothing arrives in 12 s, show the problem instead of spinning forever
      setTimeout(() => { if (!S.ready && !S.loadError) { S.loadError = "No reply from the database after 12 seconds."; onChange(); } }, 12000);
      A.onAuthStateChanged(auth, u => {
        S.user = u;
        S.isAdmin = !!(u && u.email && ADMIN_EMAIL && u.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
        if (!u) A.signInAnonymously(auth).catch(e => toast("Sign-in failed: " + (e.code || e.message) + ". Check SETUP.md step 3.", true));
        onChange();
      });
      F.onSnapshot(col("players"), s => { S.players = {}; s.forEach(d => S.players[d.id] = { id: d.id, ...d.data() }); onChange(); }, fail);
      F.onSnapshot(F.query(col("tables"), F.where("open", "==", true)), s => { S.tables = {}; s.forEach(d => S.tables[d.id] = { id: d.id, ...d.data() }); onChange(); }, fail);
      F.onSnapshot(col("nights"), s => { S.nights = {}; s.forEach(d => S.nights[d.id] = d.data()); S.ready = true; onChange(); }, fail);
      F.onSnapshot(F.doc(db, "settings", "main"), d => { S.settings = { ruleset: "uts10", selfDraw: "half", ...(d.exists() ? d.data() : {}) }; onChange(); }, fail);
      F.onSnapshot(col("tournaments"), s => { S.tournaments = {}; s.forEach(d => S.tournaments[d.id] = { id: d.id, ...d.data() }); onChange(); }, fail);
    },
    signInAdmin: () => A.signInWithPopup(auth, new A.GoogleAuthProvider()),
    signOut: () => A.signOut(auth),
    addPlayer: name => F.addDoc(col("players"), { name, active: true, createdAt: Date.now() }),
    updatePlayer: (id, p) => F.updateDoc(F.doc(db, "players", id), p),
    createTable: async data => (await F.addDoc(col("tables"), data)).id,
    updateTable: (id, p) => F.updateDoc(F.doc(db, "tables", id), p),
    addHand: h => F.setDoc(F.doc(db, "nights", h.date), { date: h.date, hands: F.arrayUnion(h) }, { merge: true }),
    replaceHand: (date, id, nh) => F.runTransaction(db, async tx => {
      const ref = F.doc(db, "nights", date);
      const snap = await tx.get(ref);
      const hands = snap.data()?.hands || [];
      tx.update(ref, { hands: nh ? hands.map(h => h.id === id ? nh : h) : hands.filter(h => h.id !== id) });
    }),
    setSettings: p => F.setDoc(F.doc(db, "settings", "main"), p, { merge: true }),
    saveTournament: async (id, data) => {
      if (id) { await F.updateDoc(F.doc(db, "tournaments", id), data); return id; }
      return (await F.addDoc(col("tournaments"), data)).id;
    },
  };
}

// Demo mode: same features, data kept only in this browser. Used until FIREBASE_CONFIG is filled in.
function makeDemoStore() {
  const KEY = "fgd-demo-v1";
  let D = null;
  try { D = JSON.parse(lsGet(KEY)); } catch {}
  if (!D) D = seedDemo();
  let cb = () => {};
  const push = () => {
    S.players = structuredClone(D.players);
    S.tables = Object.fromEntries(Object.entries(structuredClone(D.tables)).filter(([, t]) => t.open));
    S.nights = structuredClone(D.nights);
    S.settings = { ruleset: "uts10", selfDraw: "half", ...D.settings };
    S.tournaments = structuredClone(D.tournaments);
    S.isAdmin = !!D.admin; S.user = { demo: true }; S.ready = true;
    cb();
  };
  const save = () => { lsSet(KEY, JSON.stringify(D)); push(); };
  const ok = v => Promise.resolve(v);
  return {
    start(c) { cb = c; push(); },
    reset() { D = seedDemo(); save(); },
    signInAdmin() { D.admin = true; save(); return ok(); },
    signOut() { D.admin = false; save(); return ok(); },
    addPlayer(name) { const id = newId(); D.players[id] = { id, name, active: true, createdAt: Date.now() }; save(); return ok(); },
    updatePlayer(id, p) { Object.assign(D.players[id], p); save(); return ok(); },
    createTable(data) { const id = newId(); D.tables[id] = { id, ...data }; save(); return ok(id); },
    updateTable(id, p) { Object.assign(D.tables[id], p); save(); return ok(); },
    addHand(h) { (D.nights[h.date] ||= { date: h.date, hands: [] }).hands.push(h); save(); return ok(); },
    replaceHand(date, id, nh) { const n = D.nights[date]; n.hands = nh ? n.hands.map(h => h.id === id ? nh : h) : n.hands.filter(h => h.id !== id); save(); return ok(); },
    setSettings(p) { Object.assign(D.settings, p); save(); return ok(); },
    saveTournament(id, data) { if (id) Object.assign(D.tournaments[id], data); else { id = newId(); D.tournaments[id] = { id, ...data }; } save(); return ok(id); },
  };
}
function seedDemo() {
  const names = ["Ada", "Ben", "Cass", "Dee", "Eli", "Fay", "Gus", "Hana"];
  const players = {}; const ids = names.map(n => { const id = newId(); players[id] = { id, name: n, active: true, createdAt: Date.now() }; return id; });
  const tid = newId(); const now = Date.now();
  const seats = ids.slice(0, 4);
  const tables = { [tid]: { id: tid, name: "Table 1", seats, open: true, createdAt: now } };
  const nights = {};
  const mk = (ago, w, from, fan) => { const ts = now - ago * 60000; const date = sydDate(ts);
    (nights[date] ||= { date, hands: [] }).hands.push({ id: newId(), ts, date, tableId: tid, tableName: "Table 1", seats, winner: seats[w], discarder: from === "self" ? null : seats[from], selfDraw: from === "self", draw: false, fan, tournamentId: null, stage: null, round: null }); };
  // Sample hands from "last week" and "today"
  [[10090, 0, 2, 3], [10070, 1, "self", 5], [10050, 2, 0, 4], [10030, 0, "self", 8], [10010, 3, 1, 3]].forEach(a => mk(...a));
  [[40, 1, 3, 4], [30, 0, 2, 6], [20, 2, "self", 3], [8, 3, 0, 5]].forEach(a => mk(...a));
  return { players, tables, nights, settings: { ruleset: "uts10", selfDraw: "half" }, tournaments: {}, admin: false };
}

let store;

// ---------- rendering ----------
const app = document.getElementById("app");
let rq = false;
function scheduleRender() { _hands = null; if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); }
function render() {
  _hands = null;
  const a = document.activeElement, aid = a && a.id, caret = a && "selectionStart" in a ? a.selectionStart : null;
  document.getElementById("status").outerHTML = statusPill();

    : `<div class="loading">Loading the den…</div>`;

function statusPill() {
  if (DEMO) return `<span id="status" class="pill demo">${S.isAdmin ? "Demo · admin" : "Demo"}</span>`;
  if (S.isAdmin) return `<span id="status" class="pill admin">Admin</span>`;
  return `<span id="status" class="pill">${S.user ? "Live" : "Connecting…"}</span>`;
}
function renderTabs() {
  const tabs = [["record", "胡", "Record"], ["tables", "桌", "Tables"], ["scores", "分", "Scores"], ["tourney", "賽", "Tourney"], ["settings", "設", "More"]];
  const cur = ui.tab === "history" || ui.tab === "thistory" ? "scores" : ui.tab;
  document.getElementById("tabs").innerHTML = tabs.map(([k, ic, l]) =>
    `<button class="${cur === k ? "on" : ""}" data-act="tab" data-tab="${k}" ${cur === k ? 'aria-current="page"' : ""}><span class="ic" aria-hidden="true">${ic}</span>${l}</button>`).join("");
}
const confirmBtn = (key, label, confirmLabel, act, extra = "", klass = "btn ghost") =>
  ui.confirm === key
    ? `<button class="btn danger" data-act="${act}" data-confirmed="1" ${extra}>${confirmLabel}</button>`
    : `<button class="${klass}" data-act="arm" data-key="${key}">${label}</button>`;

function handLine(h) {
  if (h.draw) return `<b>Draw</b>`;
  return h.selfDraw ? `<b>${esc(pname(h.winner))}</b> self-drew ${h.fan} fan` : `<b>${esc(pname(h.winner))}</b> won ${h.fan} fan off ${esc(pname(h.discarder))}`;
}
function tourneyLine(t) {
  if (!t.tournamentId) return "";
  const T = S.tournaments[t.tournamentId]; if (!T) return "";
  const n = roundCount(T, t.id), hpr = T.handsPerRound;
  return `<b>${esc(T.name)}</b> · ${stageLabel(T)} · ` + (n >= hpr ? `round complete (${n} of ${hpr} hands)` : `hand ${n + 1} of ${hpr}`);
}

const VIEWS = {};

VIEWS.record = () => {
  const open = openTables();
  if (!open.length) return S.isAdmin
    ? `<section class="card empty"><h2>No table is open</h2><p class="muted">Open a table and seat four players, then record hands here.</p><button class="btn" data-act="tab" data-tab="tables">Open a table</button></section>`
    : `<section class="card empty"><h2>No table is open</h2><p class="muted">Once the admin opens a table and four players are seated, record hands here.</p></section>`;
  if (!ui.tableId || !S.tables[ui.tableId]) ui.tableId = open[0].id;
  const t = S.tables[ui.tableId];
  if (ui.winner && !t.seats.includes(ui.winner)) { ui.winner = null; ui.from = null; }
  if (ui.from && ui.from !== "self" && (!t.seats.includes(ui.from) || ui.from === ui.winner)) ui.from = null;
  let h = `<div class="stack"><div class="label">Table</div><div class="chips">${open.map(x =>
    `<button class="chip ${x.id === t.id ? "on" : ""}" data-act="pickTable" data-id="${x.id}">${esc(x.name)}<span class="cnt">${x.seats.length}/4</span></button>`).join("")}</div>`;
  const tl = tourneyLine(t);
  if (tl) h += `<div class="note">${tl}</div>`;
  if (t.seats.length < 4) return h + `<section class="card empty"><h2>${esc(t.name)} needs four players</h2><p class="muted">${t.seats.length} seated so far. Seat everyone before recording a hand.</p><button class="btn" data-act="tab" data-tab="tables">Seat players</button></section></div>`;

  h += `<div class="label">Who won?</div><div class="pgrid">${t.seats.map(p =>
    `<button class="pbtn ${ui.winner === p ? "on" : ""}" data-act="pickWinner" data-id="${p}">${esc(pname(p))}</button>`).join("")}</div>`;
  h += `<div class="label">Off whom?</div><div class="pgrid">`;
  if (ui.winner) {
    h += `<button class="pbtn self ${ui.from === "self" ? "on" : ""}" data-act="pickFrom" data-id="self"><small>Everyone pays</small>Self-draw</button>`;
    h += t.seats.filter(p => p !== ui.winner).map(p => `<button class="pbtn ${ui.from === p ? "on" : ""}" data-act="pickFrom" data-id="${p}"><small>Discarded by</small>${esc(pname(p))}</button>`).join("");
  } else h += `<p class="muted span2">Pick the winner first.</p>`;
  h += `</div>`;
  h += `<div class="label">Fan · ${esc(RULESETS[S.settings.ruleset]?.name)}</div><div class="tiles">${fanRange().map(f =>
    `<button class="tile ${ui.fan === f ? "on" : ""}" data-act="pickFan" data-fan="${f}" aria-label="${f} fan, ${num(basePoints(f, S.settings.ruleset))} points"><b>${f}</b><span>${num(basePoints(f, S.settings.ruleset))}</span></button>`).join("")}</div>`;
  const ready = ui.winner && ui.from && ui.fan;
  if (ready) {
    const d = handDeltas({ seats: t.seats, winner: ui.winner, discarder: ui.from === "self" ? null : ui.from, selfDraw: ui.from === "self", fan: ui.fan }, S.settings);
    h += `<div class="preview">${t.seats.map(p => `<div><span>${esc(pname(p))}</span><b class="num ${cls(d[p] || 0)}">${fmt(d[p] || 0)}</b></div>`).join("")}</div>`;
  }
  h += `<div class="actions"><button class="btn big" data-act="recordHand" ${ready ? "" : "disabled"}>Record hand</button>
    ${confirmBtn("draw:" + t.id, "Record a draw (no winner)", "Tap again to record a draw", "recordDraw")}</div>`;
  const today = sydDate(Date.now());
  const recent = allHands().filter(x => x.tableId === t.id && x.date === today).slice(-5).reverse();
  if (recent.length) h += `<section class="card"><h3>Latest at ${esc(t.name)}</h3><ul class="hands">${recent.map(x => {
    const d = handDeltas(x, S.settings); return `<li><span class="t">${timeOf(x.ts)}</span><span class="d">${handLine(x)}</span><span class="v ${cls(d[x.winner] || 0)}">${x.draw ? "" : fmt(d[x.winner] || 0)}</span></li>`; }).join("")}</ul></section>`;
  return h + `</div>`;
};

VIEWS.tables = () => {
  const open = openTables();
  const seatedAt = {}; open.forEach(t => t.seats.forEach(p => seatedAt[p] = t));
  let h = `<div class="stack">`;
  if (S.isAdmin) h += `<section class="card"><h2>Open a table</h2><div class="inline"><input type="text" id="newTable" data-model="newTable" placeholder="Table ${open.length + 1}" value="${esc(ui.d.newTable || "")}" maxlength="40" aria-label="Table name"><button class="btn" data-act="openTable">Open</button></div></section>`;
  if (!open.length) h += S.isAdmin ? `<p class="muted">No tables are open right now.</p>` : `<section class="card empty"><h2>No tables are open</h2><p class="muted">The admin opens tables. Once one is open, you can seat yourself and others here.</p></section>`;
  for (const t of open) {
    const locked = t.tournamentId && !S.isAdmin;
    const avail = activePlayers().filter(p => !t.seats.includes(p.id) && (S.isAdmin || !seatedAt[p.id]?.tournamentId));
    h += `<section class="card"><div class="row between"><h2 class="grow">${esc(t.name)}</h2>${t.tournamentId ? `<span class="badge">Tournament</span>` : ""}<span class="muted small num">${t.seats.length}/4</span></div>`;
    h += t.seats.length ? `<ul class="seats">${t.seats.map(p => `<li><span class="grow">${esc(pname(p))}</span>${locked ? "" : `<button class="x" data-act="unseat" data-t="${t.id}" data-id="${p}" aria-label="Remove ${esc(pname(p))}">✕</button>`}</li>`).join("")}</ul>` : `<p class="muted">Nobody seated yet.</p>`;
    if (!locked && t.seats.length < 4) h += `<select id="seat-${t.id}" data-change="seat" data-t="${t.id}" aria-label="Add a player to ${esc(t.name)}"><option value="">Add a player…</option>${avail.map(p =>
      `<option value="${p.id}">${esc(p.name)}${seatedAt[p.id] ? ` (moves from ${esc(seatedAt[p.id].name)})` : ""}</option>`).join("")}</select>`;
    if (locked) h += `<p class="muted small">Tournament seating is set by the admin.</p>`;
    else if (S.isAdmin) h += `<div>${confirmBtn("close:" + t.id, "Close table", "Tap again to close " + esc(t.name), "closeTable", `data-t="${t.id}"`)}</div>`;
    h += `</section>`;
  }
  if (!activePlayers().length) h += `<p class="note warn">There are no players yet. The admin adds players under More.</p>`;
  return h + `</div>`;
};

function boardRows(list, opts = {}) {
  return `<ul class="board">${list.map((s, i) => {
    const tieUp = opts.tie && i > 0 && sameMetrics(list[i - 1], s);
    const tieDown = opts.tie && i < list.length - 1 && sameMetrics(list[i + 1], s);
    const meta = [`${s.wins} win${s.wins === 1 ? "" : "s"}`, `${s.selfDraws} self-draw${s.selfDraws === 1 ? "" : "s"}`, `${s.dealIns} deal-in${s.dealIns === 1 ? "" : "s"}`,
      s.bestFan ? `best ${s.bestFan} fan` : "", opts.tie ? `${s.fanTotal} fan total` : "", `${s.played} hand${s.played === 1 ? "" : "s"}`, opts.nights ? `${s.nights.size} night${s.nights.size === 1 ? "" : "s"}` : ""].filter(Boolean).join(" · ");
    const tieCtl = (tieUp || tieDown) ? ` <span class="badge warn">tied</span>` + (S.isAdmin && opts.T ? `<span class="tiebtns">${tieUp ? `<button data-act="tieSwap" data-t="${opts.T.id}" data-stage="${opts.stage}" data-i="${i}" data-dir="-1" aria-label="Move up">▲</button>` : ""}${tieDown ? `<button data-act="tieSwap" data-t="${opts.T.id}" data-stage="${opts.stage}" data-i="${i}" data-dir="1" aria-label="Move down">▼</button>` : ""}</span>` : "") : "";
    return `<li class="${opts.cut && i === opts.cut ? "cut" : ""}"><span class="rk">${i + 1}</span><span class="nm">${esc(pname(s.id))}${tieCtl}</span><span class="pts ${cls(s.pts)}">${fmt(s.pts)}</span><span class="meta">${meta}</span></li>`;
  }).join("")}</ul>`;
}
const rulesNote = () => `<p class="muted small">Scored with ${esc(RULESETS[S.settings.ruleset]?.name)}; self-draw: ${esc((SELF_DRAW[S.settings.selfDraw] || SELF_DRAW.half).name.toLowerCase())}.</p>`;

VIEWS.scores = () => {
  const hands = allHands();
  const dates = [...new Set(hands.map(h => h.date))].sort().reverse();
  const today = sydDate(Date.now());
  let h = `<div class="stack"><div class="seg" role="tablist">${[["today", "Today"], ["night", "Night"], ["all", "All-time"], ["tourney", "Tourneys"], ["elo", "Elo"]].map(([k, l]) =>
    `<button class="${ui.scope === k ? "on" : ""}" data-act="scope" data-scope="${k}">${l}</button>`).join("")}</div>`;
  if (ui.scope === "tourney") return h + tourneyHistory() + `</div>`;
  if (ui.scope === "elo") return h + `<section class="card empty"><h2>Elo ratings</h2><span class="badge warn">To be created</span>
    <p class="muted">Player ratings are coming in a later update. Every hand recorded from day one keeps the seats, winner and discarder, so the ratings will cover your full history once they're added.</p></section></div>`;
  let sel, title;
  if (ui.scope === "night") {

    sel = hands.filter(x => x.date === ui.date); title = niceDate(ui.date);

  else { sel = hands.filter(x => x.date === today); title = "Today · " + niceDate(today); }

function tourneyHistory() {
  const all = Object.values(S.tournaments).sort((a, b) => b.createdAt - a.createdAt);
  let h = "";
  if (!all.length) return `<section class="card empty"><h2>No tournaments yet</h2><p class="muted">Finished and running tournaments show up here with their results.</p></section>`;
  const wins = {};
  all.filter(T => T.stage === "done" && T.champion).forEach(T => wins[T.champion] = (wins[T.champion] || 0) + 1);
  const champs = Object.entries(wins).sort((a, b) => b[1] - a[1] || pname(a[0]).localeCompare(pname(b[0])));
  if (champs.length) h += `<section class="card"><h3>Tournament wins</h3><ul class="board">${champs.map(([id, n], i) =>
    `<li><span class="rk">${i + 1}</span><span class="nm">${esc(pname(id))}</span><span class="pts num">${n}</span></li>`).join("")}</ul></section>`;
  for (const T of all) {
    const open = ui.tOpen?.[T.id] ?? false;
    const handCount = tHands(T).length;
    const summary = T.stage === "done" ? `Champion: <b>${esc(pname(T.champion))}</b>` : `<span class="badge">Live</span> ${stageLabel(T)}`;
    h += `<div class="night"><button data-act="toggleT" data-t="${T.id}" aria-expanded="${open}"><span><h2>${esc(T.name)}</h2><span class="muted small">${niceDate(T.date)} · ${(T.playerIds || []).length} players · ${handCount} hand${handCount === 1 ? "" : "s"}</span><div class="small">${summary}</div></span><span aria-hidden="true">${open ? "▾" : "▸"}</span></button>`;
    if (open) {
      h += `<div class="body stack">`;
      if (T.stage === "final" || T.stage === "done") h += `<div><h3>Final table</h3>${boardRows(tStandings(T, "final"), { tie: true })}</div>`;
      h += `<div><h3>Qualifying (${T.qualRounds} round${T.qualRounds === 1 ? "" : "s"} of ${T.handsPerRound} hands)</h3>${boardRows(tStandings(T, "qual"), { tie: true, cut: 4 })}</div>`;
      if (S.isAdmin && T.stage !== "done") h += tournamentAdmin(T);
      h += `<button class="btn link" data-act="viewT" data-t="${T.id}">Open in Tourney tab</button></div>`;
    }
    h += `</div>`;
  }
  return h + rulesNote();
}
VIEWS.thistory = () => { ui.tab = "scores"; ui.scope = "tourney"; return VIEWS.scores(); };

VIEWS.history = () => {
  const dates = Object.keys(S.nights).filter(d => S.nights[d].hands?.length).sort().reverse();
  let h = `<div class="stack"><div class="row between"><h2>Hand history</h2><button class="btn link" data-act="tab" data-tab="scores">Back to scores</button></div>`;
  if (!dates.length) return h + `<p class="muted">No hands recorded yet.</p></div>`;
  if (!S.isAdmin) h += `<p class="muted small">Spotted a mistake? Only the admin can edit or delete hands.</p>`;
  for (const d of dates.slice(0, ui.histLimit)) {
    const hs = [...S.nights[d].hands].sort((a, b) => b.ts - a.ts);
    const open = ui.histOpen[d] ?? d === dates[0];
    const tn = [...new Set(hs.filter(x => x.tournamentId).map(x => S.tournaments[x.tournamentId]?.name).filter(Boolean))];

// ---------- actions ----------
const run = async (p, okMsg, undo) => {
  try { await p; if (okMsg) toast(okMsg, false, undo); }
  catch (e) { console.error(e); toast(e?.code === "permission-denied"
    ? (S.isAdmin ? `The database didn't accept you as admin. Check the rules published in Firebase use ${S.user?.email}.` : "Not allowed. That needs the admin account.")
    : "Couldn't save: " + (e?.message || e), true); }
};
function draftReset() { ui.winner = null; ui.from = null; ui.fan = null; }
function buildHand(t, part) {
  const ts = Date.now();
  return { id: newId(), ts, date: sydDate(ts), tableId: t.id, tableName: t.name, seats: [...t.seats], winner: null, discarder: null, selfDraw: false, draw: false, fan: null,
    tournamentId: t.tournamentId || null, stage: t.stage || null, round: t.round || null, ...part };
}
// Take players off any other open table (so nobody sits at two tables at once)
async function unseatElsewhere(ids, keepTableIds) {
  for (const t of openTables()) {
    if (keepTableIds.includes(t.id)) continue;
    const left = t.seats.filter(p => !ids.includes(p));
    if (left.length !== t.seats.length) await store.updateTable(t.id, { seats: left });
  }
}

        await unseatElsewhere(ranked, tbls.map(t => t.id));
        for (let i = 0; i < tbls.length; i++) await store.updateTable(tbls[i].id, { seats: seats[i], round: T.round + 1 });
        await store.saveTournament(T.id, { round: T.round + 1 });
        toast(`Round ${T.round + 1} seated by snake order`);
      } else if (T.stage === "qual") {
        const finalists = tStandings(T, "qual").map(s => s.id).filter(id => T.playerIds.includes(id)).slice(0, 4);
        await unseatElsewhere(finalists, tbls.map(t => t.id));
        await store.updateTable(tbls[0].id, { seats: finalists, stage: "final", round: 1, name: "Final table" });
        for (const t of tbls.slice(1)) await store.updateTable(t.id, { open: false });
        await store.saveTournament(T.id, { stage: "final", round: 1, finalists, tableIds: [tbls[0].id] });
        toast("Final table seated. Points reset to zero");
      } else if (T.round < T.finalRounds) {
        for (const t of tbls) await store.updateTable(t.id, { round: T.round + 1 });
        await store.saveTournament(T.id, { round: T.round + 1 });
        toast(`Final round ${T.round + 1} started`);
      } else {
        const champion = tStandings(T, "final")[0]?.id || null;
        for (const t of tbls) await store.updateTable(t.id, { open: false });
        await store.saveTournament(T.id, { stage: "done", champion, finishedAt: Date.now() });
        toast(`${pname(champion)} wins ${T.name}`);
      }
    } catch (e) { console.error(e); toast("Couldn't advance: " + (e.message || e), true); }
  },
  async saveTSettings(d) {
    const T = S.tournaments[d.t];
    const p = { name: (ui.d.eName ?? T.name).trim() || T.name, round: Math.max(1, Math.round(+(ui.d.eRound ?? T.round)) || 1),
      handsPerRound: Math.max(1, +(ui.d.eHpr ?? T.handsPerRound)), qualRounds: Math.max(1, +(ui.d.eQr ?? T.qualRounds)), finalRounds: Math.max(1, +(ui.d.eFr ?? T.finalRounds)) };
    ui.d.eHpr = ui.d.eQr = ui.d.eFr = ui.d.eName = ui.d.eRound = undefined;
    try {
      if (p.round !== T.round) for (const t of (T.tableIds || []).map(id => S.tables[id]).filter(Boolean)) await store.updateTable(t.id, { round: p.round });
      await store.saveTournament(T.id, p); toast("Tournament updated");
    } catch (e) { console.error(e); toast("Couldn't save: " + (e.message || e), true); }
  },
  async pauseT(d) {
    const T = S.tournaments[d.t];
    const tbls = (T.tableIds || []).map(id => S.tables[id]).filter(Boolean);
    try {
      const pausedTables = tbls.map(t => ({ id: t.id, name: t.name, seats: t.seats }));
      for (const t of tbls) await store.updateTable(t.id, { open: false });
      await store.saveTournament(T.id, { paused: true, pausedAt: Date.now(), pausedTables });
      toast(`${T.name} paused`);
    } catch (e) { console.error(e); toast("Couldn't pause: " + (e.message || e), true); }
  },
  async resumeT(d) {
    const T = S.tournaments[d.t];
    const snap = T.pausedTables || [];
    try {
      await unseatElsewhere(snap.flatMap(t => t.seats), snap.map(t => t.id));
      for (const t of snap) await store.updateTable(t.id, { open: true, seats: t.seats, round: T.round, stage: T.stage });
      await store.saveTournament(T.id, { paused: false, pausedTables: [] });
      toast(`${T.name} resumed`);
    } catch (e) { console.error(e); toast("Couldn't resume: " + (e.message || e), true); }
  },
  async tieSwap(d) {
    const T = S.tournaments[d.t]; const list = tStandings(T, d.stage).map(s => s.id);
    const i = +d.i, j = i + +d.dir; [list[i], list[j]] = [list[j], list[i]];
    const rest = (T.tieOrder || []).filter(id => !list.includes(id));
    await run(store.saveTournament(T.id, { tieOrder: [...list, ...rest] }), "Order updated");
  },
};
const CHANGES = {
  async seat(el) {
    const pid = el.value; if (!pid) return;
    const t = S.tables[el.dataset.t];
    const from = openTables().find(x => x.id !== t.id && x.seats.includes(pid));
    if (from) await run(store.updateTable(from.id, { seats: from.seats.filter(p => p !== pid) }));
    await run(store.updateTable(t.id, { seats: [...t.seats, pid].slice(0, 4) }));
  },
  night(el) { ui.date = el.value; },
  async ruleset(el) { await run(store.setSettings({ ruleset: el.value }), `Now scoring with ${RULESETS[el.value].name}`); },
  async selfDraw(el) { await run(store.setSettings({ selfDraw: el.value }), "Self-draw rule updated"); },
  tPlayer(el) { const s = new Set(ui.d.tPlayers || []); el.checked ? s.add(el.value) : s.delete(el.value); ui.d.tPlayers = [...s]; },
  editFrom(el) { ui.edit.from = el.value; drawEdit(); return "keep"; },
  editWin(el) { ui.edit.winner = el.value; if (ui.edit.from === el.value) ui.edit.from = "self"; drawEdit(); return "keep"; },
  editFan(el) { ui.edit.fan = +el.value; return "keep"; },
};
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (act === "closeModal" && ev.target.closest("[data-stop]") && el.classList.contains("modal-bg")) return; // click inside the dialog
  if (!A[act]) return;
  if (act !== "arm") ui.confirm = null;
  const r = await A[act](el.dataset, el, ev);
  if (r !== "keep") render();
});
document.addEventListener("change", async ev => {
  const el = ev.target.closest("[data-change]"); if (!el) return;
  const r = await CHANGES[el.dataset.change]?.(el);
  if (r !== "keep") render();
});
document.addEventListener("input", ev => { const el = ev.target; if (el.dataset?.model) ui.d[el.dataset.model] = el.value; });
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && ui.edit) { modal.innerHTML = ""; ui.edit = null; }
  if (ev.key === "Enter" && ev.target.dataset?.model) {
    const m = ev.target.dataset.model;
    const act = { newTable: "openTable", newPlayer: "addPlayer" }[m];
    if (act) { ev.preventDefault(); A[act]({}).then(render); }
    if (m === "rename") { ev.preventDefault(); A.saveName({ id: ui.d.editing }).then(render); }
  }
});

// ---------- boot ----------
(async () => {
  try { store = DEMO ? makeDemoStore() : await makeFirebaseStore(); }
  catch (e) { console.error(e); app.innerHTML = `<section class="card"><h2>Couldn't start</h2><p>${esc(e.message || e)}</p><p class="muted">Check the Firebase details at the top of index.html.</p></section>`; return; }
  store.start(scheduleRender);
  render();
})();
// Exposed for testing
window.__fgd = { handDeltas, basePoints, snakeSeat, rankList, statsFor, S, ui };
</script>
